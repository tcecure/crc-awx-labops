server {
    server_name labops.drcc.digitalrcc.com;

    client_max_body_size 25M;

    # This host serves only the LabOps console; the shared portal root would otherwise
    # look identical to my.digitalrcc.com here.
    location = / {
        return 302 /labops;
    }

    location / {
        proxy_pass http://192.168.1.65:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-sent events: no buffering, long-lived reads for the activity relay.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/labops.drcc.digitalrcc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/labops.drcc.digitalrcc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = labops.drcc.digitalrcc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name labops.drcc.digitalrcc.com;
    return 404; # managed by Certbot


}