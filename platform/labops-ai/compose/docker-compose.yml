# DigitalRCC LabOps AI — investigation runtime on drcc-labops-01.
#
# Phase 2 (see docs/phase2/03-investigation-isolation.md): there is no longer a long-lived
# shared agent server. The gateway creates one ephemeral agent container per investigation
# (scripts/run-investigation.sh), attached to labops-model only. The single service here is
# the model proxy: it is the only member of labops-model with a route off the host, and it is
# the only place the provider API key exists.
#
# Digest-pinned images only. Never a floating tag.
services:
  model-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: labops-model-proxy
    restart: unless-stopped
    # holds LABOPS_LLM_API_KEY and LABOPS_MODEL_PROXY_TOKEN; never mounted into an
    # investigation container and never part of agent.env
    env_file: /etc/labops/model-proxy.env
    environment:
      LABOPS_LLM_UPSTREAM: api.openai.com
    volumes:
      - ./model-proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /etc/nginx/conf.d:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      labops-model:
        ipv4_address: 172.31.241.2
      labops-egress:

networks:
  # Investigation containers live here. internal: true means Docker adds no default route and
  # no masquerade, so a workspace has no path off the host at all — the proxy address is the
  # only socket it can open. nftables enforces the same thing a second time.
  labops-model:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.241.0/24
  # Outer leg of the proxy only. Fixed subnet so the nftables forward allow-list can match it.
  labops-egress:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.31.240.0/24
