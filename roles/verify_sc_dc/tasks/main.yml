  ansible.builtin.set_fact:
    "pod{{ '%02d' | format(pod_id) }}_sc_dc_results":
      M1-L1: "{{ v_m1l1.output[0] }}"
      M2-L1: "{{ v_m2l1.output[0] }}"
      M4-L1: "{{ v_m4l1.output[0] }}"
      M4-L2: "{{ v_m4l2.output[0] }}"
