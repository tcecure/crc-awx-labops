---
# verify_sc_gw/tasks/main.yml
# Verifies SC lab completion on PodXX-GW (pfSense)
# Checks firewall rules, VLANs, logging, interfaces

- name: Read pfSense config.xml
  ansible.builtin.raw: cat /cf/conf/config.xml
  register: pfsense_config
  changed_when: false

- name: Parse firewall rules
  ansible.builtin.raw: |
    php -r "
    require_once('config.inc');
    \$config = parse_config(true);
    \$rules = isset(\$config['filter']['rule']) ? \$config['filter']['rule'] : array();
    echo json_encode(array(
      'rule_count' => count(\$rules),
      'has_allow_any' => false,
      'has_default_deny' => false,
      'has_logging' => isset(\$config['syslog']['filterdescriptions']),
      'vlan_count' => isset(\$config['vlans']['vlan']) ? count(\$config['vlans']['vlan']) : 0,
      'interface_count' => count(\$config['interfaces']),
      'hostname' => \$config['system']['hostname']
    ));
    "
  register: fw_state
  changed_when: false

- name: Set firewall facts
  ansible.builtin.set_fact:
    fw_info: "{{ fw_state.stdout | from_json }}"
  when: fw_state.stdout is defined and (fw_state.stdout | trim) != ''

# ========================================================================
# Per-lab verification
# ========================================================================

- name: "Verify M1-L2 (Deny By Default)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M1-L2') and fw_info is defined
  block:
    - name: Check no Allow Any Any rule exists
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$found = false;
        foreach (\$config['filter']['rule'] as \$r) {
          if (\$r['type'] == 'pass' && isset(\$r['source']['any']) && isset(\$r['destination']['any'])
              && !isset(\$r['protocol'])) {
            \$found = true;
            break;
          }
        }
        echo \$found ? 'FAIL:AllowAnyExists' : 'PASS:NoAllowAny';
        "
      register: m1l2_check
      changed_when: false

    - name: Check default deny exists as the last LAN rule
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        // Later SC labs append DMZ and VLAN rules after the LAN ruleset, and pfSense
        // keeps a separate ordered list per interface, so the deny is judged as the
        // last LAN rule rather than the last rule in config.xml. The pfSense UI writes
        // the catch-all as either any/any or 'LAN net' to any.
        \$lan = array();
        foreach (\$config['filter']['rule'] as \$r) {
          if (isset(\$r['interface']) && \$r['interface'] == 'lan') \$lan[] = \$r;
        }
        \$n = count(\$lan);
        if (\$n == 0) { echo 'FAIL:NoLANRules'; exit; }
        \$last = \$lan[\$n - 1];
        \$deny = (\$last['type'] == 'block' && isset(\$last['destination']['any'])
                  && !isset(\$last['destination']['port']));
        echo \$deny ? 'PASS:DefaultDenyLast' : 'FAIL:NoDefaultDeny';
        "
      register: m1l2_deny
      changed_when: false

    - name: M1-L2 Result
      ansible.builtin.debug:
        msg: "M1-L2 Deny By Default: {{ m1l2_check.stdout }} | {{ m1l2_deny.stdout }}"

- name: "Verify M1-L3 (Monitor/Control/Protect)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M1-L3') and fw_info is defined
  block:
    - name: Check logging enabled on rules
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$logged = 0;
        foreach (\$config['filter']['rule'] as \$r) {
          if (isset(\$r['log'])) \$logged++;
        }
        echo (\$logged >= 2) ? 'PASS:LoggingEnabled('.\$logged.')' : 'FAIL:InsufficientLogging('.\$logged.')';
        "
      register: m1l3_check
      changed_when: false

    - name: M1-L3 Result
      ansible.builtin.debug:
        msg: "M1-L3 Monitor/Control/Protect: {{ m1l3_check.stdout }}"

- name: "Verify M2-L2 (DMZ)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M2-L2') and fw_info is defined
  block:
    - name: Check DMZ/OPT interface exists
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$has_opt = false;
        foreach (array_keys(\$config['interfaces']) as \$iface) {
          if (strpos(\$iface, 'opt') === 0) { \$has_opt = true; break; }
        }
        echo \$has_opt ? 'PASS:DMZExists' : 'FAIL:NoDMZ';
        "
      register: m2l2_check
      changed_when: false

    - name: M2-L2 Result
      ansible.builtin.debug:
        msg: "M2-L2 Secure DMZ: {{ m2l2_check.stdout }}"

- name: "Verify M2-L3 (VLANs)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M2-L3') and fw_info is defined
  block:
    - name: Check VLANs exist
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$count = isset(\$config['vlans']['vlan']) ? count(\$config['vlans']['vlan']) : 0;
        echo (\$count >= 2) ? 'PASS:VLANs('.\$count.')' : 'FAIL:NoVLANs('.\$count.')';
        "
      register: m2l3_check
      changed_when: false

    - name: M2-L3 Result
      ansible.builtin.debug:
        msg: "M2-L3 Segmentation: {{ m2l3_check.stdout }}"

- name: "Verify M3-L1 (Rule Audit)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M3-L1') and fw_info is defined
  block:
    - name: Check messy rules cleaned
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        // pfSense keeps one ordered ruleset per interface and every interface
        // legitimately ends in its own catch-all deny, so a duplicate is judged
        // within an interface and includes protocol and port — otherwise the LAN
        // and VLAN default denies grade as copies of each other and the lab
        // becomes impossible to pass.
        \$issues = array();
        \$seen = array();
        \$n = 0;
        foreach (\$config['filter']['rule'] as \$r) {
          \$n++;
          \$iface = isset(\$r['interface']) ? \$r['interface'] : '?';
          \$label = 'rule '.\$n.' on '.\$iface.(isset(\$r['descr']) && \$r['descr'] != '' ? \" ('\".\$r['descr'].\"')\" : '');
          if (\$r['type'] == 'pass' && isset(\$r['source']['any']) && isset(\$r['destination']['any'])
              && !isset(\$r['protocol'])) \$issues[] = \$label.': allows any to any';
          \$sig = \$iface.'|'.\$r['type'].'|'.(isset(\$r['protocol']) ? \$r['protocol'] : 'any')
                 .'|'.json_encode(\$r['source']).'|'.json_encode(\$r['destination']);
          if (isset(\$seen[\$sig])) { \$issues[] = \$label.': duplicate of rule '.\$seen[\$sig]; }
          else { \$seen[\$sig] = \$n; }
        }
        echo (count(\$issues) == 0) ? 'PASS:RulesClean'
          : 'FAIL:Issues('.count(\$issues).'): '.implode('; ', \$issues);
        "
      register: m3l1_check
      changed_when: false

    - name: M3-L1 Result
      ansible.builtin.debug:
        msg: "M3-L1 Rule Audit: {{ m3l1_check.stdout }}"

- name: "Verify M3-L2 (Rule Ordering)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M3-L2') and fw_info is defined
  block:
    - name: Check the LAN default deny is the last LAN rule
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        // The lab reorders Firewall > Rules > LAN only, and pfSense keeps a
        // separate ordered list per interface, so positions are compared
        // within the LAN interface. The catch-all deny may be written either
        // as any/any or as 'LAN net' to any, which is what the pfSense UI
        // produces, so only the destination is required to be any.
        \$lan = array();
        foreach (\$config['filter']['rule'] as \$r) {
          if (isset(\$r['interface']) && \$r['interface'] == 'lan') \$lan[] = \$r;
        }
        \$n = count(\$lan);
        if (\$n == 0) { echo 'FAIL:NoLANRules'; exit; }
        \$allows = 0;
        foreach (\$lan as \$r) { if (\$r['type'] == 'pass') \$allows++; }
        \$last = \$lan[\$n - 1];
        \$deny_last = (\$last['type'] == 'block' && isset(\$last['destination']['any'])
                       && !isset(\$last['destination']['port']));
        if (\$deny_last && \$allows > 0) { echo 'PASS:OrderCorrect'; }
        elseif (\$allows == 0) { echo 'FAIL:NoAllowRules'; }
        else { echo 'FAIL:OrderWrong'; }
        "
      register: m3l2_check
      changed_when: false

    - name: M3-L2 Result
      ansible.builtin.debug:
        msg: "M3-L2 Rule Ordering: {{ m3l2_check.stdout }}"

- name: "Verify M3-L3 (Least Privilege)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M3-L3') and fw_info is defined
  block:
    - name: Check only HTTPS allowed to accounting
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$acct_ip = '{{ lan_network }}.100';
        \$bad_ports = array(); \$has_443 = false;
        // Choosing HTTPS from the pfSense port dropdown stores the service name rather
        // than the number, so both spellings count as the HTTPS rule. A single host may
        // also be written with an explicit /32.
        \$https = array('443', 'https', 'HTTPS', '443-443');
        foreach (\$config['filter']['rule'] as \$r) {
          \$dst = isset(\$r['destination']['address']) ? preg_replace('#/32\$#', '', \$r['destination']['address']) : '';
          if (\$dst == \$acct_ip && \$r['type'] == 'pass') {
            \$port = isset(\$r['destination']['port']) ? \$r['destination']['port'] : 'any';
            if (in_array(\$port, \$https, true)) { \$has_443 = true; }
            else { \$bad_ports[] = \$port; }
          }
        }
        // Deleting every rule to the accounting host also fails the lab, so the two
        // failures are reported apart instead of both reading 'ExtraPorts'.
        if (\$has_443 && count(\$bad_ports) == 0) { echo 'PASS:OnlyHTTPS'; }
        elseif (!\$has_443 && count(\$bad_ports) == 0) { echo 'FAIL:NoHTTPSRuleTo'.\$acct_ip; }
        elseif (!\$has_443) { echo 'FAIL:NoHTTPSRuleTo'.\$acct_ip.'; also open: '.implode(',', \$bad_ports); }
        else { echo 'FAIL:ExtraPorts('.count(\$bad_ports).'): '.implode(',', \$bad_ports); }
        "
      register: m3l3_check
      changed_when: false

    - name: M3-L3 Result
      ansible.builtin.debug:
        msg: "M3-L3 Least Privilege: {{ m3l3_check.stdout }}"

- name: "Verify M4-L3 (Capstone)"
  when: (sc_lab_id is not defined or sc_lab_id == 'ALL' or sc_lab_id == 'M4-L3') and fw_info is defined
  block:
    - name: Capstone comprehensive check
      ansible.builtin.raw: |
        php -r "
        require_once('config.inc');
        \$config = parse_config(true);
        \$checks = array();

        // Check 1: No Allow Any Any
        \$allow_any = false;
        foreach (\$config['filter']['rule'] as \$r) {
          if (\$r['type'] == 'pass' && isset(\$r['source']['any']) && isset(\$r['destination']['any'])
              && !isset(\$r['protocol'])) { \$allow_any = true; break; }
        }
        \$checks['deny_by_default'] = !\$allow_any;

        // Check 2: WAN secured
        \$wan_open = false;
        foreach (\$config['filter']['rule'] as \$r) {
          if (isset(\$r['interface']) && \$r['interface'] == 'wan' && \$r['type'] == 'pass'
              && isset(\$r['source']['any']) && isset(\$r['destination']['any'])) { \$wan_open = true; }
        }
        \$checks['wan_secured'] = !\$wan_open;

        // Check 3: No Telnet exposure
        \$telnet = false;
        foreach (\$config['filter']['rule'] as \$r) {
          if (\$r['type'] == 'pass' && isset(\$r['destination']['port']) && strpos(\$r['destination']['port'], '23') !== false
              && isset(\$r['interface']) && \$r['interface'] == 'wan') { \$telnet = true; }
        }
        \$checks['no_telnet'] = !\$telnet;

        // Check 4: Logging enabled on the block rules (Task 4). pfSense
        // records this per rule; \$config['syslog'] holds log *display* and
        // remote-server settings, not whether rules log.
        // A student cannot act on 'failing: logging' without knowing which rule
        // is missing the tick, so the unlogged ones are named.
        \$blocks = 0; \$blocks_logged = 0; \$unlogged = array(); \$n = 0;
        foreach (\$config['filter']['rule'] as \$r) {
          \$n++;
          if (\$r['type'] == 'block') {
            \$blocks++;
            if (isset(\$r['log'])) { \$blocks_logged++; }
            else {
              \$unlogged[] = 'rule '.\$n.' on '.(isset(\$r['interface']) ? \$r['interface'] : '?')
                            .(isset(\$r['descr']) && \$r['descr'] != '' ? \" ('\".\$r['descr'].\"')\" : '');
            }
          }
        }
        \$checks['logging'] = (\$blocks > 0 && \$blocks == \$blocks_logged);
        \$detail = '';
        if (\$blocks == 0) { \$detail = 'no block rules exist yet'; }
        elseif (count(\$unlogged) > 0) {
          \$detail = 'logging off on '.implode('; ', \$unlogged);
        }

        // Check 5: Has VLANs or segmentation
        \$checks['segmentation'] = isset(\$config['vlans']['vlan']) && count(\$config['vlans']['vlan']) >= 2;

        \$passed = array_sum(\$checks);
        \$total = count(\$checks);
        echo json_encode(array('passed' => \$passed, 'total' => \$total, 'checks' => \$checks,
                               'detail' => \$detail));
        "
      register: m4l3_check
      changed_when: false

    - name: M4-L3 Result
      ansible.builtin.debug:
        msg: "M4-L3 Capstone: {{ m4l3_check.stdout }}"

# ========================================================================
# Consolidate GW lab results for the training tracker
#   Produces sc_gw_lab_results = { 'M1-L2': {completed, reason}, ... }
#   for the 8 gateway-verified SC labs. Keys are bare (no SC- prefix);
#   the playbook adds the SC- prefix during consolidation.
# ========================================================================

- name: Build SC gateway lab results for this pod
  ansible.builtin.set_fact:
    sc_gw_lab_results:
      M1-L2:
        completed: "{{ (((m1l2_check.stdout | default('')) is search('^PASS')) and ((m1l2_deny.stdout | default('')) is search('^PASS'))) | bool }}"
        reason: "{{ (m1l2_check.stdout | default('not checked') | trim) ~ ' | ' ~ (m1l2_deny.stdout | default('not checked') | trim) }}"
      M1-L3:
        completed: "{{ ((m1l3_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m1l3_check.stdout | default('not checked') | trim }}"
      M2-L2:
        completed: "{{ ((m2l2_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m2l2_check.stdout | default('not checked') | trim }}"
      M2-L3:
        completed: "{{ ((m2l3_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m2l3_check.stdout | default('not checked') | trim }}"
      M3-L1:
        completed: "{{ ((m3l1_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m3l1_check.stdout | default('not checked') | trim }}"
      M3-L2:
        completed: "{{ ((m3l2_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m3l2_check.stdout | default('not checked') | trim }}"
      M3-L3:
        completed: "{{ ((m3l3_check.stdout | default('')) is search('^PASS')) | bool }}"
        reason: "{{ m3l3_check.stdout | default('not checked') | trim }}"
      M4-L3:
        completed: "{{ (((m4l3_check.stdout | default('{}') | from_json).passed | default(0) | int) == ((m4l3_check.stdout | default('{}') | from_json).total | default(-1) | int)) | bool }}"
        reason: >-
          {{ ('capstone: passed '
              ~ ((m4l3_check.stdout | default('{}') | from_json).passed | default(0) | int)
              ~ '/'
              ~ ((m4l3_check.stdout | default('{}') | from_json).total | default(0) | int)
              ~ ' checks'
              ~ (('; failing: ' ~ (((m4l3_check.stdout | default('{}') | from_json).checks | default({}))
                  | dict2items | rejectattr('value') | map(attribute='key') | list | join(', ')))
                 if (((m4l3_check.stdout | default('{}') | from_json).checks | default({}))
                     | dict2items | rejectattr('value') | list | length) > 0 else '')
              ~ ((' (' ~ ((m4l3_check.stdout | default('{}') | from_json).detail | default('')) ~ ')')
                 if ((m4l3_check.stdout | default('{}') | from_json).detail | default('')) != ''
                 else ''))
             if (m4l3_check.stdout is defined) else 'not checked' }}

- name: Show SC gateway lab results
  ansible.builtin.debug:
    var: sc_gw_lab_results
