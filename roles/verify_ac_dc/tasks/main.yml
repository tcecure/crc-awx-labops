---
# Verify tasks for shared DC mode (OU-based pod isolation)
# Expects variables: pod_id (int), prefix (e.g. "P01")
- name: "Pod{{ '%02d' | format(pod_id) }} L1.1 - Check ex.employee exists, disabled, not in Finance"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-ex.employee" -Properties Enabled,MemberOf -ErrorAction Stop
        $inFinance = ($u.MemberOf | ForEach-Object { (Get-ADGroup $_).Name }) -contains "$p-SG-ACS-Finance"
        if ($u -and (-not $u.Enabled) -and (-not $inFinance)) {
          @{ completed = $true; reason = "$p-ex.employee exists, disabled, not in Finance" }
        } else {
          $reasons = @()
          if ($u.Enabled) { $reasons += "still enabled" }
          if ($inFinance) { $reasons += "still in Finance" }
          @{ completed = $false; reason = "$p-ex.employee: " + ($reasons -join ", ") }
        }
      } catch {
        @{ completed = $false; reason = "$p-ex.employee not found: $_" }
      }
  register: v_l11

- name: "Pod{{ '%02d' | format(pod_id) }} L1.2 - Check hr.user1 not in Finance, in HR"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-hr.user1" -Properties MemberOf -ErrorAction Stop
        $groups = $u.MemberOf | ForEach-Object { (Get-ADGroup $_).Name }
        $inFinance = $groups -contains "$p-SG-ACS-Finance"
        $inHR = $groups -contains "$p-SG-ACS-HR"
        if ((-not $inFinance) -and $inHR) {
          @{ completed = $true; reason = "$p-hr.user1 not in Finance, in HR" }
        } else {
          $reasons = @()
          if ($inFinance) { $reasons += "still in Finance" }
          if (-not $inHR) { $reasons += "not in HR" }
          @{ completed = $false; reason = "$p-hr.user1: " + ($reasons -join ", ") }
        }
      } catch {
        @{ completed = $false; reason = "$p-hr.user1 not found: $_" }
      }
  register: v_l12

- name: "Pod{{ '%02d' | format(pod_id) }} L1.3 - Check it.helpdesk not in IT-Admins"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-it.helpdesk" -Properties MemberOf -ErrorAction Stop
        $groups = $u.MemberOf | ForEach-Object { (Get-ADGroup $_).Name }
        $inITAdmins = $groups -contains "$p-SG-ACS-IT-Admins"
        if (-not $inITAdmins) {
          @{ completed = $true; reason = "$p-it.helpdesk not in IT-Admins" }
        } else {
          @{ completed = $false; reason = "$p-it.helpdesk still in IT-Admins" }
        }
      } catch {
        @{ completed = $false; reason = "$p-it.helpdesk not found: $_" }
      }
  register: v_l13

- name: "Pod{{ '%02d' | format(pod_id) }} L2.1 - Check new.user1 exists, enabled"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-new.user1" -Properties Enabled,DistinguishedName -ErrorAction Stop
        if ($u -and $u.Enabled) {
          @{ completed = $true; reason = "$p-new.user1 exists, enabled, DN=$($u.DistinguishedName)" }
        } else {
          @{ completed = $false; reason = "$p-new.user1 exists but disabled" }
        }
      } catch {
        @{ completed = $false; reason = "$p-new.user1 not found: $_" }
      }
  register: v_l21

- name: "Pod{{ '%02d' | format(pod_id) }} L2.2 - Check consult.user1 removed from Consulting, in Sales"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-consult.user1" -Properties MemberOf -ErrorAction Stop
        $groups = $u.MemberOf | ForEach-Object { (Get-ADGroup $_).Name }
        $inConsulting = $groups -contains "$p-SG-ACS-Consulting"
        $inSales = $groups -contains "$p-SG-ACS-Sales"
        if ((-not $inConsulting) -and $inSales) {
          @{ completed = $true; reason = "$p-consult.user1 not in Consulting, in Sales" }
        } else {
          $reasons = @()
          if ($inConsulting) { $reasons += "still in Consulting" }
          if (-not $inSales) { $reasons += "not in Sales" }
          @{ completed = $false; reason = "$p-consult.user1: " + ($reasons -join ", ") }
        }
      } catch {
        @{ completed = $false; reason = "$p-consult.user1 not found: $_" }
      }
  register: v_l22

- name: "Pod{{ '%02d' | format(pod_id) }} L2.3 - Check fin.user1 disabled, in Terminated OU, stripped groups"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-fin.user1" -Properties Enabled,DistinguishedName,MemberOf -ErrorAction Stop
        $disabled = -not $u.Enabled
        $inTermOU = $u.DistinguishedName -match "OU=Terminated"
        $groups = @($u.MemberOf | ForEach-Object { (Get-ADGroup $_).Name } | Where-Object { $_ -ne "Domain Users" })
        $stripped = $groups.Count -eq 0
        if ($disabled -and $inTermOU -and $stripped) {
          @{ completed = $true; reason = "$p-fin.user1 disabled, in Terminated OU, groups stripped" }
        } else {
          $reasons = @()
          if (-not $disabled) { $reasons += "still enabled" }
          if (-not $inTermOU) { $reasons += "not in Terminated OU (DN=$($u.DistinguishedName))" }
          if (-not $stripped) { $reasons += "still has groups: $($groups -join ',')" }
          @{ completed = $false; reason = "$p-fin.user1: " + ($reasons -join ", ") }
        }
      } catch {
        @{ completed = $false; reason = "$p-fin.user1 not found: $_" }
      }
  register: v_l23

- name: "Pod{{ '%02d' | format(pod_id) }} L3.1 - Check sales.user1 in correct Sales OU"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-sales.user1" -Properties DistinguishedName -ErrorAction Stop
        $inSalesOU = $u.DistinguishedName -match "OU=Sales"
        if ($inSalesOU) {
          @{ completed = $true; reason = "$p-sales.user1 in Sales OU: $($u.DistinguishedName)" }
        } else {
          @{ completed = $false; reason = "$p-sales.user1 not in Sales OU: $($u.DistinguishedName)" }
        }
      } catch {
        @{ completed = $false; reason = "$p-sales.user1 not found: $_" }
      }
  register: v_l31

- name: "Pod{{ '%02d' | format(pod_id) }} L3.2 - Check IT-Admins does not contain All-Staff"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $members = Get-ADGroupMember -Identity "$p-SG-ACS-IT-Admins" -ErrorAction Stop | Select-Object -ExpandProperty Name
        $hasAllStaff = $members -contains "$p-SG-ACS-All-Staff"
        if (-not $hasAllStaff) {
          @{ completed = $true; reason = "$p-SG-ACS-All-Staff removed from IT-Admins" }
        } else {
          @{ completed = $false; reason = "$p-SG-ACS-All-Staff still nested in IT-Admins" }
        }
      } catch {
        @{ completed = $false; reason = "IT-Admins group check error: $_" }
      }
  register: v_l32

- name: "Pod{{ '%02d' | format(pod_id) }} L3.3 - Check delegation (password reset on Staff OU)"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      try {
        $domainDN = (Get-ADDomain).DistinguishedName
        $staffOU = "OU=Staff,OU=Users,OU=$podName,OU=Students,$domainDN"
        $acl = Get-Acl "AD:\$staffOU"
        $helpdesk = Get-ADUser "$p-it.helpdesk" -ErrorAction Stop
        $helpdeskSID = $helpdesk.SID
        $resetPwdGuid = [guid]"00299570-246d-11d0-a768-00aa006e0529"
        $hasDelegation = $false
        foreach ($ace in $acl.Access) {
          if ($ace.IdentityReference -match [regex]::Escape("$p-it.helpdesk") -or $ace.IdentityReference -match $helpdeskSID) {
            if ($ace.ObjectType -eq $resetPwdGuid -and $ace.AccessControlType -eq "Allow") {
              $hasDelegation = $true
              break
            }
          }
        }
        if ($hasDelegation) {
          @{ completed = $true; reason = "$p-it.helpdesk has password reset delegation on Staff OU" }
        } else {
          @{ completed = $false; reason = "$p-it.helpdesk missing password reset delegation on Staff OU" }
        }
      } catch {
        @{ completed = $false; reason = "Delegation check error: $_" }
      }
  register: v_l33

- name: "Pod{{ '%02d' | format(pod_id) }} L4.1 - Check contractor.user1 disabled or expiration set"
  ansible.windows.win_powershell:
    script: |
      $p = "{{ prefix }}"
      try {
        $u = Get-ADUser -Identity "$p-contractor.user1" -Properties Enabled,AccountExpirationDate -ErrorAction Stop
        $disabled = -not $u.Enabled
        $hasExpiry = $null -ne $u.AccountExpirationDate
        if ($disabled -or $hasExpiry) {
          $reasons = @()
          if ($disabled) { $reasons += "disabled" }
          if ($hasExpiry) { $reasons += "expiry=$($u.AccountExpirationDate)" }
          @{ completed = $true; reason = "$p-contractor.user1: " + ($reasons -join ", ") }
        } else {
          @{ completed = $false; reason = "$p-contractor.user1 still enabled with no expiry" }
        }
      } catch {
        @{ completed = $false; reason = "$p-contractor.user1 not found: $_" }
      }
  register: v_l41

- name: "Pod{{ '%02d' | format(pod_id) }} L4.2 - Check review.csv exists and non-empty"
  ansible.windows.win_powershell:
    script: |
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      $path = "C:\CyberLab\$podName\Lab4-2\review.csv"
      if (Test-Path $path) {
        $size = (Get-Item $path).Length
        if ($size -gt 0) {
          @{ completed = $true; reason = "review.csv exists, size=${size} bytes" }
        } else {
          @{ completed = $false; reason = "review.csv exists but is empty" }
        }
      } else {
        @{ completed = $false; reason = "review.csv not found at $path" }
      }
  register: v_l42

- name: "Pod{{ '%02d' | format(pod_id) }} L4.3 - Check Lab4-3 exists with required files non-empty"
  ansible.windows.win_powershell:
    script: |
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      $dir = "C:\CyberLab\$podName\Lab4-3"
      if (Test-Path $dir) {
        $files = Get-ChildItem -Path $dir -File
        if ($files.Count -gt 0) {
          $nonEmpty = @($files | Where-Object { $_.Length -gt 0 })
          $empty = @($files | Where-Object { $_.Length -eq 0 })
          if ($empty.Count -eq 0) {
            @{ completed = $true; reason = "Lab4-3 dir exists with $($nonEmpty.Count) non-empty file(s)" }
          } else {
            @{ completed = $false; reason = "Lab4-3 has $($empty.Count) empty file(s): $($empty.Name -join ',')" }
          }
        } else {
          @{ completed = $false; reason = "Lab4-3 directory exists but contains no files" }
        }
      } else {
        @{ completed = $false; reason = "Lab4-3 directory not found at $dir" }
      }
  register: v_l43

- name: "Consolidate Pod{{ '%02d' | format(pod_id) }} results"
  ansible.builtin.set_fact:
    "pod{{ '%02d' | format(pod_id) }}_results":
      L1.1: "{{ v_l11.output[0] }}"
      L1.2: "{{ v_l12.output[0] }}"
      L1.3: "{{ v_l13.output[0] }}"
      L2.1: "{{ v_l21.output[0] }}"
      L2.2: "{{ v_l22.output[0] }}"
      L2.3: "{{ v_l23.output[0] }}"
      L3.1: "{{ v_l31.output[0] }}"
      L3.2: "{{ v_l32.output[0] }}"
      L3.3: "{{ v_l33.output[0] }}"
      L4.1: "{{ v_l41.output[0] }}"
      L4.2: "{{ v_l42.output[0] }}"
      L4.3: "{{ v_l43.output[0] }}"
