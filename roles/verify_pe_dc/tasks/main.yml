---
- name: "Verify Pod{{ '%02d' | format(pod_id) }} PE evidence"
  ansible.windows.win_powershell:
    script: |
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      $prefix = "P{{ '%02d' | format(pod_id) }}"
      $artifactDir = "C:\CyberLab\$podName\PE-Artifacts"

      function New-Result {
          param([System.Collections.Generic.List[string]]$Reasons, [string]$Success)
          if ($Reasons.Count -eq 0) { return @{ completed = $true; reason = $Success } }
          return @{ completed = $false; reason = ($Reasons -join '; ') }
      }

      function Require-File {
          param([System.Collections.Generic.List[string]]$Reasons, [string]$Name)
          $path = Join-Path $artifactDir $Name
          if (-not (Test-Path $path)) { $Reasons.Add("$Name not found") }
          return $path
      }

      # Seeded identifiers are compared without case or padding sensitivity: a student
      # retyping the cell as "temp-p06-014 " documents the same badge.
      function Same-Id {
          param([object]$Value, [string]$Expected)
          return ([string]$Value).Trim().ToLowerInvariant() -eq $Expected.ToLowerInvariant()
      }

      function Find-Row {
          param([object[]]$Rows, [string]$Column, [string]$Expected)
          return $Rows | Where-Object { Same-Id $_.$Column $Expected } | Select-Object -Last 1
      }

      # Students annotate the seeded records in their own words ("Unauthorized access",
      # "Authorized - business need"), so verdicts are matched on the word rather than
      # compared to a fixed string. 'unauthorized' is tested first because it contains
      # 'authorized'.
      function Is-FalseValue {
          param([object]$Value)
          return ([string]$Value).Trim().ToLowerInvariant() -match 'unauthorized|not authorized|\bno\b|false|deny|denied'
      }

      function Is-TrueValue {
          param([object]$Value)
          if (Is-FalseValue $Value) { return $false }
          return ([string]$Value).Trim().ToLowerInvariant() -match 'authorized|\byes\b|true|permitted|approved'
      }

      $results = @{}

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M1-L1.txt' | Out-Null
      Require-File $reasons 'PE-M1-L1_EmployeeRoster.csv' | Out-Null
      Require-File $reasons 'PE-M1-L1_BadgeRoster.csv' | Out-Null
      Require-File $reasons 'PE-M1-L1_ServerRoomAccessList.csv' | Out-Null
      $reviewPath = Require-File $reasons 'PE-M1-L1_AccessReview.csv'
      if (Test-Path $reviewPath) {
          $rows = @(Import-Csv $reviewPath)
          $terminated = Find-Row $rows 'SubjectId' 'EMP-104'
          $contractor = Find-Row $rows 'SubjectId' 'CTR-209'
          if (-not $terminated -or -not (Is-FalseValue $terminated.Finding)) { $reasons.Add('Taylor Reed must be identified as unauthorized') }
          if (-not $terminated -or ([string]$terminated.RequiredAction).Trim().ToLowerInvariant() -notmatch 'disab|remov|revok') { $reasons.Add('Taylor Reed requires badge disablement and access removal') }
          if (-not $contractor -or -not (Is-FalseValue $contractor.Finding)) { $reasons.Add('Morgan Blake must be identified as unauthorized') }
          if (-not $contractor -or ([string]$contractor.RequiredAction).Trim().ToLowerInvariant() -notmatch 'remov|revok|escort') { $reasons.Add('Morgan Blake requires access removal or escorted access') }
      }
      $results['M1-L1'] = New-Result $reasons 'Access review identifies the terminated employee and unauthorized contractor'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M1-L2.txt' | Out-Null
      Require-File $reasons 'PE-M1-L2_BadgeLog.csv' | Out-Null
      Require-File $reasons 'PE-M1-L2_ServerRoomLog.csv' | Out-Null
      Require-File $reasons 'PE-M1-L2_EmployeeRoster.csv' | Out-Null
      $decisionPath = Require-File $reasons 'PE-M1-L2_AccessDecision.csv'
      if (Test-Path $decisionPath) {
          $rows = @(Import-Csv $decisionPath)
          foreach ($eventId in @('E-1001','E-1003')) {
              $row = Find-Row $rows 'EventId' $eventId
              if (-not $row -or -not (Is-TrueValue $row.Authorized)) { $reasons.Add("$eventId must be marked authorized") }
              elseif ([string]::IsNullOrWhiteSpace($row.Reason)) { $reasons.Add("$eventId requires a reason") }
          }
          foreach ($eventId in @('E-1002','E-1004')) {
              $row = Find-Row $rows 'EventId' $eventId
              if (-not $row -or -not (Is-FalseValue $row.Authorized)) { $reasons.Add("$eventId must be marked unauthorized") }
              elseif ([string]::IsNullOrWhiteSpace($row.Reason)) { $reasons.Add("$eventId requires a reason") }
          }
      }
      $results['M1-L2'] = New-Result $reasons 'Server-room events are correctly reconciled with employee and access records'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M2-L1.txt' | Out-Null
      Require-File $reasons 'PE-M2-L1_VisitorLog.csv' | Out-Null
      Require-File $reasons 'PE-M2-L1_RepairTicket.txt' | Out-Null
      Require-File $reasons 'PE-M2-L1_CameraObservation.txt' | Out-Null
      Require-File $reasons 'PE-M2-L1_EscortPolicy.txt' | Out-Null
      $escortPath = Require-File $reasons 'PE-M2-L1_EscortReview.csv'
      if (Test-Path $escortPath) {
          $record = Find-Row @(Import-Csv $escortPath) 'VisitorId' 'V-3002'
          if (-not $record -or ([string]$record.Finding).Trim().ToLowerInvariant() -notmatch 'unescorted|no escort|without( an)? escort') { $reasons.Add('V-3002 must be identified as unescorted') }
          if (-not $record -or ([string]$record.RequiredAction).Trim().ToLowerInvariant() -notmatch 'report|incident|remov|escort') { $reasons.Add('escort violation requires a documented corrective action') }
          if (-not $record -or ([string]$record.Evidence).Length -lt 15) { $reasons.Add('escort finding requires evidence from the seeded records') }
      }
      $results['M2-L1'] = New-Result $reasons 'Visitor V-3002 is correctly identified as entering without an escort'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M2-L2.txt' | Out-Null
      Require-File $reasons 'PE-M2-L2_TemporaryBadgeInventory.csv' | Out-Null
      $visitorPath = Require-File $reasons 'PE-M2-L2_VisitorLog.csv'
      if (Test-Path $visitorPath) {
          $record = @(Import-Csv $visitorPath) | Select-Object -First 1
          if (-not $record -or -not (Same-Id $record.TemporaryBadgeId "TEMP-$prefix-014")) { $reasons.Add("temporary badge TEMP-$prefix-014 must be issued") }
          if (-not $record -or -not (Same-Id $record.EscortId 'EMP-102')) { $reasons.Add('EMP-102 must be assigned as the escort') }
          $signIn = [datetime]::MinValue
          $signOut = [datetime]::MinValue
          if (-not $record -or -not [datetime]::TryParse($record.SignIn, [ref]$signIn)) { $reasons.Add('visitor sign-in time is missing or invalid') }
          if (-not $record -or -not [datetime]::TryParse($record.SignOut, [ref]$signOut)) { $reasons.Add('visitor sign-out time is missing or invalid') }
          elseif ($signOut -le $signIn) { $reasons.Add('visitor sign-out must be after sign-in') }
          if (-not $record -or -not (Is-TrueValue $record.BadgeReturned)) { $reasons.Add('temporary badge must be recorded as returned') }
      }
      $results['M2-L2'] = New-Result $reasons 'Temporary badge, escort, sign-in/out, and return workflow is complete'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M3-L1.txt' | Out-Null
      Require-File $reasons 'PE-M3-L1_BadgeControllerExport.csv' | Out-Null
      Require-File $reasons 'PE-M3-L1_VisitorSignInSheet.csv' | Out-Null
      Require-File $reasons 'PE-M3-L1_AlarmLog.csv' | Out-Null
      $discrepancyPath = Require-File $reasons 'PE-M3-L1_DiscrepancyReview.csv'
      if (Test-Path $discrepancyPath) {
          $rows = @(Import-Csv $discrepancyPath)
          $badge = Find-Row $rows 'DiscrepancyId' 'D-01'
          $alarm = Find-Row $rows 'DiscrepancyId' 'D-02'
          if (-not $badge -or -not (Same-Id $badge.SourceEvent 'BC-5003') -or ([string]$badge.Finding).Trim().ToLowerInvariant() -notmatch 'after|returned|18:42') { $reasons.Add('D-01 must identify badge use after visitor sign-out and return') }
          if (-not $badge -or ([string]$badge.RequiredAction).Trim().ToLowerInvariant() -notmatch 'disab|investigat|revok') { $reasons.Add('D-01 requires badge containment or investigation') }
          if (-not $alarm -or -not (Same-Id $alarm.SourceEvent 'ALM-9007') -or ([string]$alarm.Finding).Trim().ToLowerInvariant() -notmatch 'forced|no badge|unmatched') { $reasons.Add('D-02 must identify the forced-door alarm without a matching badge event') }
          if (-not $alarm -or ([string]$alarm.RequiredAction).Trim().ToLowerInvariant() -notmatch 'investigat|incident|review') { $reasons.Add('D-02 requires investigation or incident handling') }
      }
      $results['M3-L1'] = New-Result $reasons 'Badge, visitor, and alarm records are reconciled with both discrepancies documented'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_PE-M3-L2.txt' | Out-Null
      Require-File $reasons 'PE-M3-L2_LostBadgeReport.txt' | Out-Null
      Require-File $reasons 'PE-M3-L2_AccessEventsAfterLoss.csv' | Out-Null
      $inventoryPath = Require-File $reasons 'PE-M3-L2_BadgeInventory.csv'
      $incidentPath = Require-File $reasons 'PE-M3-L2_IncidentReport.csv'
      if (Test-Path $inventoryPath) {
          $inventory = @(Import-Csv $inventoryPath)
          # Students often append a corrected row instead of editing the seeded one, so
          # the most recent row for a badge is the authoritative one.
          $lost = Find-Row $inventory 'BadgeId' "B-$prefix-115"
          $replacement = Find-Row $inventory 'BadgeId' "B-$prefix-215"
          if (-not $lost -or ([string]$lost.Status).Trim().ToLowerInvariant() -notmatch 'disab|revok') { $reasons.Add("B-$prefix-115 must be disabled or revoked") }
          if (-not $replacement -or ([string]$replacement.Status).Trim().ToLowerInvariant() -notmatch 'active|issued') { $reasons.Add("B-$prefix-215 must be active") }
          if (-not $replacement -or -not (Same-Id $replacement.EmployeeId 'EMP-115')) { $reasons.Add("B-$prefix-215 must be assigned to EMP-115") }
      }
      if (Test-Path $incidentPath) {
          $record = @(Import-Csv $incidentPath) | Select-Object -First 1
          if (-not $record -or -not (Same-Id $record.LostBadgeId "B-$prefix-115")) { $reasons.Add('incident report has the wrong lost badge') }
          if (-not $record -or -not (Same-Id $record.PostLossEventId 'EVT-6112')) { $reasons.Add('incident report must cite EVT-6112') }
          if (-not $record -or ([string]$record.ContainmentAction).Trim().ToLowerInvariant() -notmatch 'disab|revok') { $reasons.Add('incident report must document badge disablement') }
          if (-not $record -or -not (Same-Id $record.ReplacementBadgeId "B-$prefix-215")) { $reasons.Add('incident report has the wrong replacement badge') }
          if (-not $record -or [string]::IsNullOrWhiteSpace($record.ReportedBy)) { $reasons.Add('incident report is missing ReportedBy') }
          if (-not $record -or ([string]$record.Summary).Length -lt 25) { $reasons.Add('incident summary is incomplete (as saved it is ' + ([string]$record.Summary).Length + ' characters - keep the whole summary on one line, a line break inside the cell truncates it)') }
      }
      $results['M3-L2'] = New-Result $reasons 'Lost badge is disabled, replacement issued, and post-loss access documented'

      $results
  register: pe_verify

- name: "Consolidate Pod{{ '%02d' | format(pod_id) }} PE results"
  ansible.builtin.set_fact:
    "pod{{ '%02d' | format(pod_id) }}_pe_results": "{{ pe_verify.output[0] }}"
