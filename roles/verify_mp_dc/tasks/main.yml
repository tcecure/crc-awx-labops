---
- name: "Verify Pod{{ '%02d' | format(pod_id) }} MP evidence"
  ansible.windows.win_powershell:
    script: |
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      $prefix = "P{{ '%02d' | format(pod_id) }}"
      $artifactDir = "C:\CyberLab\$podName\MP-Artifacts"
      $mountWaived = ${{ mp_media_mount_waived | default(true) | bool | ternary('true', 'false') }}

      function New-Result {
          param([System.Collections.Generic.List[string]]$Reasons, [string]$Success)
          if ($Reasons.Count -eq 0) { return @{ completed = $true; reason = $Success } }
          return @{ completed = $false; reason = ($Reasons -join '; ') }
      }

      function Require-File {
          param([System.Collections.Generic.List[string]]$Reasons, [string]$Name)
          $path = Join-Path $artifactDir $Name
          if (-not (Test-Path $path)) { $Reasons.Add("$Name not found") }
          return $path
      }

      # Students write these columns in their own words ("Purge (cryptographic erase)",
      # "Reuse - internal", "FCI - contains contract data"), so the graders below match
      # the decisive word instead of comparing against a fixed string.
      function Normalize-Text {
          param([object]$Value)
          return ([string]$Value).Trim().ToLowerInvariant()
      }

      function Same-Id {
          param([object]$Value, [string]$Expected)
          return (Normalize-Text $Value) -eq $Expected.ToLowerInvariant()
      }

      function Is-NonFci {
          param([object]$Value)
          return (Normalize-Text $Value) -match 'non[- ]?fci|not fci|no fci|does not contain|public|general'
      }

      function Is-Fci {
          param([object]$Value)
          if (Is-NonFci $Value) { return $false }
          return (Normalize-Text $Value) -match 'fci|federal contract'
      }

      $results = @{}

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_MP-M1-L1.txt' | Out-Null
      Require-File $reasons "$prefix-FCI-USB.vhdx" | Out-Null
      Require-File $reasons "$prefix-Employee-Handbook.vhdx" | Out-Null
      Require-File $reasons 'MediaInventory.xlsx' | Out-Null
      Require-File $reasons 'MediaClassificationWorksheet.docx' | Out-Null
      Require-File $reasons 'MediaDisposalPolicy.pdf' | Out-Null
      $responsePath = Require-File $reasons 'MediaClassificationResponses.csv'
      if (Test-Path $responsePath) {
          $rows = @(Import-Csv $responsePath)
          # The Media cell is often retyped without the .vhdx extension or with different
          # casing, so rows are located by the media name rather than the exact file name.
          $fci = $rows | Where-Object { (Normalize-Text $_.Media) -match 'fci-usb' } | Select-Object -Last 1
          $general = $rows | Where-Object { (Normalize-Text $_.Media) -match 'handbook' } | Select-Object -Last 1
          if (-not $fci -or -not (Is-Fci $fci.Classification)) {
              $reasons.Add("$prefix-FCI-USB.vhdx must be classified as FCI (recorded: '$($fci.Classification)')")
          } elseif ([string]::IsNullOrWhiteSpace($fci.Evidence) -or $fci.Evidence.Length -lt 10) {
              $reasons.Add('FCI media evidence is incomplete')
          }
          if (-not $general -or -not (Is-NonFci $general.Classification)) {
              $reasons.Add("$prefix-Employee-Handbook.vhdx must be classified as Non-FCI (recorded: '$($general.Classification)')")
          } elseif ([string]::IsNullOrWhiteSpace($general.Evidence) -or $general.Evidence.Length -lt 10) {
              $reasons.Add('Non-FCI media evidence is incomplete')
          }
      }
      $results['M1-L1'] = New-Result $reasons 'Media classification worksheet correctly identifies FCI and non-FCI media'

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_MP-M1-L2.txt' | Out-Null
      $vhdxPath = Require-File $reasons "$prefix-FCI-USB.vhdx"
      $metadataPath = Require-File $reasons 'MP-M1-L2_SeedMetadata.json'
      $logPath = Require-File $reasons 'MediaSanitizationLog.csv'
      $certificatePath = Require-File $reasons 'MediaSanitizationCertificate.csv'

      foreach ($recordPath in @($logPath, $certificatePath)) {
          if (Test-Path $recordPath) {
              $record = @(Import-Csv $recordPath) | Select-Object -First 1
              if (-not $record -or -not (Same-Id $record.MediaId "$prefix-FCI-USB")) { $reasons.Add("$(Split-Path $recordPath -Leaf) has the wrong media ID") }
              if (-not $record -or (Normalize-Text $record.Method) -notmatch 'clear|purge|crypto') { $reasons.Add("$(Split-Path $recordPath -Leaf) must name the NIST 800-88 method used - Clear or Purge (recorded: '$($record.Method)')") }
              if (-not $record -or (Normalize-Text $record.Result) -match 'fail' -or (Normalize-Text $record.Result) -notmatch 'pass|success|verified') { $reasons.Add("$(Split-Path $recordPath -Leaf) must record the verification outcome as Pass once you have confirmed the media is empty (recorded: '$($record.Result)')") }
              if (-not $record -or (Normalize-Text $record.Disposition) -notmatch 'reus') { $reasons.Add("$(Split-Path $recordPath -Leaf) must record Reuse disposition (recorded: '$($record.Disposition)')") }
              if (-not $record -or [string]::IsNullOrWhiteSpace($record.SanitizedBy)) { $reasons.Add("$(Split-Path $recordPath -Leaf) is missing SanitizedBy") }
              $date = [datetime]::MinValue
              if (-not $record -or -not [datetime]::TryParse($record.Date, [ref]$date)) { $reasons.Add("$(Split-Path $recordPath -Leaf) has an invalid date") }
          }
      }

      if ($mountWaived) {
          # Media re-creation needs local admin on the shared DC; grade the paperwork only.
          $results['M1-L2'] = New-Result $reasons 'Sanitization log and certificate documented for approved reuse; media re-creation waived (requires admin on shared DC)'
      } elseif ((Test-Path $vhdxPath) -and (Test-Path $metadataPath)) {
          $mountedHere = $false
          try {
              $image = Get-DiskImage -ImagePath $vhdxPath -ErrorAction Stop
              if (-not $image.Attached) {
                  Mount-DiskImage -ImagePath $vhdxPath -Access ReadOnly -ErrorAction Stop | Out-Null
                  $mountedHere = $true
              }
              $volume = Get-DiskImage -ImagePath $vhdxPath | Get-Disk | Get-Partition | Get-Volume | Where-Object FileSystem | Select-Object -First 1
              if (-not $volume) { throw 'No formatted volume was found' }
              if ($volume.FileSystemLabel -ne "$prefix-SANITIZED") { $reasons.Add("volume label must be $prefix-SANITIZED") }
              $unexpected = @(Get-ChildItem -LiteralPath $volume.Path -Force -ErrorAction Stop | Where-Object Name -notin @('System Volume Information','$RECYCLE.BIN'))
              if ($unexpected.Count -gt 0) { $reasons.Add('sanitized volume still contains files or folders') }
              $currentVolumeUniqueId = [string]$volume.UniqueId
              $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
              $seedVolumeUniqueId = [string]$metadata.OriginalVolumeUniqueId
              if ([string]::IsNullOrWhiteSpace($currentVolumeUniqueId)) { $reasons.Add('could not read sanitized volume unique ID') }
              elseif ([string]::IsNullOrWhiteSpace($seedVolumeUniqueId)) { $reasons.Add('seed metadata is missing the original volume unique ID') }
              elseif ($currentVolumeUniqueId -eq $seedVolumeUniqueId) { $reasons.Add('volume identity is unchanged; recreate and format the volume rather than deleting files') }
          } catch {
              $reasons.Add("could not inspect sanitized media: $($_.Exception.Message)")
          } finally {
              if ($mountedHere) { Dismount-DiskImage -ImagePath $vhdxPath -ErrorAction SilentlyContinue | Out-Null }
          }
      }
      if (-not $mountWaived) {
          $results['M1-L2'] = New-Result $reasons 'Media was recreated, validated empty, and documented for approved reuse'
      }

      $reasons = [System.Collections.Generic.List[string]]::new()
      Require-File $reasons '_LAB_READY_MP-M1-L3.txt' | Out-Null
      Require-File $reasons 'LaptopAssetRecord.csv' | Out-Null
      Require-File $reasons 'ChainOfCustody.csv' | Out-Null
      Require-File $reasons 'VendorDestructionCertificate.txt' | Out-Null
      $dispositionPath = Require-File $reasons 'MP-M1-L3_DispositionWorksheet.csv'
      if (Test-Path $dispositionPath) {
          $record = @(Import-Csv $dispositionPath) | Select-Object -First 1
          if (-not $record -or -not (Same-Id $record.AssetId "$prefix-LAP-017")) { $reasons.Add('disposition worksheet has the wrong asset ID') }
          if (-not $record -or (Normalize-Text $record.Decision) -notmatch 'destro') { $reasons.Add("the correct disposition is Destroy (recorded: '$($record.Decision)')") }
          if (-not $record -or -not (Same-Id $record.DriveSerial "SN-$prefix-88421")) { $reasons.Add('drive serial does not match the asset and custody records') }
          if (-not $record -or -not (Same-Id $record.CertificateId "VDC-$prefix-2026-017")) { $reasons.Add('vendor certificate ID does not match') }
          if (-not $record -or [string]::IsNullOrWhiteSpace($record.Rationale) -or $record.Rationale.Length -lt 20) { $reasons.Add('disposition rationale is incomplete') }
      }
      $results['M1-L3'] = New-Result $reasons 'Disposition worksheet correctly selects destruction and matches supporting records'

      $results
  register: mp_verify

- name: "Consolidate Pod{{ '%02d' | format(pod_id) }} MP results"
  ansible.builtin.set_fact:
    "pod{{ '%02d' | format(pod_id) }}_mp_results": "{{ mp_verify.output[0] }}"
