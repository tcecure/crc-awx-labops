---
# Remove CyDeploy Community Edition and everything this role created.
#
# Like installation, the uninstall command is unknown until the vendor
# executable is supplied, so it is a variable rather than a guess. With no
# command configured this still cleans up the workspace, the staged installer
# and the installation marker, and says what it could not do.
- name: Check for an installation marker
  ansible.windows.win_stat:
    path: "{{ cydeploy_tools_dir }}\\.installed"
  register: cydeploy_uninstall_marker

- name: Run the CyDeploy uninstall command
  ansible.windows.win_command: "{{ cydeploy_uninstall_command }}"
  register: cydeploy_uninstall_result
  changed_when: cydeploy_uninstall_result.rc == 0
  failed_when:
    - cydeploy_uninstall_result.rc != 0
    - not (cydeploy_uninstall_ignore_errors | bool)
  when:
    - cydeploy_uninstall_marker.stat.exists
    - (cydeploy_uninstall_command | default('') | trim) != ''

- name: Report that no uninstall command is configured
  ansible.builtin.debug:
    msg: >-
      CyDeploy was never installed by automation on {{ inventory_hostname }}, or
      no cydeploy_uninstall_command is configured. Lab artifacts, the staged
      installer and the pod workspace are still removed.
  when: >-
    not cydeploy_uninstall_marker.stat.exists
    or (cydeploy_uninstall_command | default('') | trim) == ''

- name: Confirm the CyDeploy service is gone
  ansible.windows.win_service_info:
    name: "{{ cydeploy_expected_service }}"
  register: cydeploy_uninstall_service
  failed_when: (cydeploy_uninstall_service.services | default([]) | length) > 0
  when: (cydeploy_expected_service | default('') | trim) != ''

- name: Remove the CyDeploy workspace, installer and marker
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ cydeploy_workspace_dir }}"
    - "{{ cydeploy_tools_dir }}"
