---
# Verify tasks for SI labs — shared DC mode (OU-based pod isolation)
# Expects variables: pod_id (int), prefix (e.g. "P01")

- name: "Pod{{ '%02d' | format(pod_id) }} SI M1-L1 — Flaw classification completed"
  ansible.windows.win_powershell:
    script: |
      $podName = "Pod{{ '%02d' | format(pod_id) }}"
      $artifactDir = "C:\CyberLab\$podName\SI-Artifacts"
      $reasons = @()
      # Lab marker must exist (means lab was seeded)
      $marker = Join-Path $artifactDir "_LAB_READY_SI-M1-L1.txt"
      if (-not (Test-Path $marker)) { $reasons += "lab not seeded (marker missing)" }
      # Student should have created completion file
      $completed = Join-Path $artifactDir "SI-M1-L1_Completed.txt"
      if (-not (Test-Path $completed)) { $reasons += "SI-M1-L1_Completed.txt not found" }
      elseif ((Get-Item $completed).Length -lt 100) { $reasons += "completion file too short (incomplete)" }
      if ($reasons.Count -eq 0) { @{ completed=$true; reason="Flaw classification worksheet submitted" } }
      else { @{ completed=$false; reason=($reasons -join "; ") } }
  register: v_m1l1

