dc01-p08 ansible_host=10.50.8.10
dc01-p09 ansible_host=10.50.9.10
dc01-p10 ansible_host=10.50.10.10

[crc_dcs:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985

