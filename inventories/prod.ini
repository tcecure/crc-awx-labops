[pve]
pve1 ansible_host=192.168.1.60 ansible_user=crc-awx

[pve:vars]
ansible_connection=ssh
ansible_ssh_private_key_file=/root/.ssh/crc-awx-pve
ansible_become=true
ansible_become_method=sudo
ansible_become_flags=-n

# Shared DCs for pods 1-10 (acs-p01.local domain, OU-based isolation)
[crc_shared_dcs]
dc01 ansible_host=10.50.1.10
dc02 ansible_host=10.50.1.11

[crc_shared_dcs:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
shared_domain=acs-p01.local
shared_domain_dn=DC=acs-p01,DC=local

# Legacy per-pod DCs (kept for backward compatibility until migration validated)
[crc_dcs]
dc01-p01 ansible_host=10.50.1.10
dc01-p02 ansible_host=10.50.2.10
dc01-p03 ansible_host=10.50.3.10
