---
# Runs on the shared DCs by default; set crc_target_mode=member_server to
# run on each pod session host instead (crc_pod_servers).
# seed all pods on the shared DCs using OU-based isolation
- name: "Seed Labs: CMMC Level 1 System & Information Integrity (SI)"
  hosts: >-
    {{ 'crc_pod_servers'
       if (crc_target_mode | default('shared_dc')) == 'member_server'
       else 'crc_shared_dcs[0]' }}
  gather_facts: false
  vars:
    seed_user_password: "{{ seed_user_password | default(lookup('env', 'SEED_USER_PASSWORD')) }}"
    # Target selection (backward compatible):
    #   pods="7"       -> only Pod07
    #   pods="7,9,12"  -> those pods
    #   pod_id=7       -> only Pod07 (alias, used by the portal per-pod action)
    #   (neither set)  -> range(1, pod_count+1)  [original behavior]
    pod_list: >-
      {{ [pod_id | int]
         if (crc_target_mode | default('shared_dc')) == 'member_server'
         else (
              ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
              if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
              else (range(1, (pod_count | default(20) | int) + 1) | list)
         ) }}
  tasks:
    - name: Copy seed-si-baseline.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_si_dc/files/seed-si-baseline.ps1"
        dest: C:\Windows\Temp\seed-si-baseline.ps1

    - name: Copy apply-si-lab.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_si_dc/files/apply-si-lab.ps1"
        dest: C:\Windows\Temp\apply-si-lab.ps1

    - name: Deploy SI templates to DC
      ansible.windows.win_file:
        path: C:\CyberLab\_Templates\SI
        state: directory

    - name: Copy SI artifact templates
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../templates/si/"
        dest: C:\CyberLab\_Templates\SI\

    - name: "Seed SI baseline for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\seed-si-baseline.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: baseline_results

    - name: Show baseline results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ baseline_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Apply all SI lab seeds for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\apply-si-lab.ps1
        -PodId {{ item }} -TemplatesPath "C:\CyberLab\_Templates\SI"
      loop: "{{ pod_list }}"
      register: seed_results

    - name: Show seed results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ seed_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Write SI seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: |
        $d = "C:\CyberLab\Pod{{ '%02d' | format(item) }}\.families"
        New-Item -ItemType Directory -Force -Path $d | Out-Null
        Set-Content -Path (Join-Path $d 'SI.seeded') -Value (Get-Date -Format o)
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"
