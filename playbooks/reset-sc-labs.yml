---
# reset-sc-labs.yml
# Resets SC labs to baseline on PodXX-GW + DC01

- name: Reset SC Labs on PodXX-GW Gateways
  hosts: crc_pod_gateways
  gather_facts: false
  tasks:
    # pfSense has no usable Python interpreter, so copy+shell cannot be used here;
    # script copies and executes in one step, the same way seed_sc_gw does.
    - name: Run SC reset on pfSense
      ansible.builtin.script: "{{ playbook_dir }}/../roles/seed_sc_gw/files/reset-sc-labs.sh {{ pod_id }}"
      args:
        executable: /bin/sh
      register: reset_result

    - name: Display reset result
      ansible.builtin.debug:
        var: reset_result.stdout_lines

- name: Reset SC Artifacts on DC01
  hosts: crc_shared_dcs
  gather_facts: false
  tasks:
    - name: Reset SC artifacts for each pod
      ansible.windows.win_shell: |
        powershell -ExecutionPolicy Bypass -File C:\CyberLab\_Scripts\reset-sc-labs.ps1 -PodId {{ item }}
      loop: "{{ range(1, 21) | list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"

    - name: "Clear SC seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_file:
        path: "C:\\CyberLab\\Pod{{ '%02d' | format(item) }}\\.families\\SC.seeded"
        state: absent
      loop: "{{ range(1, 21) | list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"
