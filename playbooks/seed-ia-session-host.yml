---
# Seed (and reset) the two IA lab states that live on the student's own session
# host instead of on the domain controller:
#
#   M2-L1  "PodNN ACS Nightly Backup" runs as the human account PNN-s.jenkins
#          and the student repoints it at their own service account. Storing a
#          task credential needs local admin, which the student only has here.
#          The account a task runs as also needs SeBatchLogonRight, and the
#          service account the student creates cannot be named in advance, so
#          the right is granted to the domain users that sign in to this pod
#          server. Without it the task saves but every run dies with 4625
#          0xC000015B / LastTaskResult 267011, including the seeded one.
#   M3-L2  the local account policy is weak (6 characters, no complexity, no
#          lockout) and the student hardens it. The domain policy is shared by
#          all 20 pods, so grading it credited every pod as soon as one student
#          (or an instructor) changed it.
#
# The evidence pull (playbooks/sync-pod-evidence.yml) snapshots both into
# HostState\host-state.json so verify-cmmc-ia.yml can grade them on the DC.
#
# For M3-L2 to be the student's own lab, OU=PodServers must not inherit the
# account policy of the Default Domain Policy — playbooks/setup-pod-server-policy-scope.yml
# blocks that inheritance once, otherwise every gpupdate silently reverts the
# student's work.
#
#   crc_session_host_mode: seed    (default) weak policy + task as s.jenkins
#   crc_session_host_mode: reset   weak policy, task removed
- name: "Seed Labs: IA state on the pod session hosts"
  hosts: crc_pod_servers
  gather_facts: false
  vars:
    seed_mode: "{{ crc_session_host_mode | default('seed') }}"
    pod_num: "{{ inventory_hostname | regex_replace('^[Pp][Oo][Dd]0*([0-9]+)-[Ss][Rr][Vv]$', '\\1') }}"
    pod_name: "Pod{{ '%02d' | format(pod_num | int) }}"
    prefix: "P{{ '%02d' | format(pod_num | int) }}"
    task_name: "{{ pod_name }} ACS Nightly Backup"
    netbios: "{{ shared_domain_netbios | default('ACS-P01') }}"
    # pods=/pod_id= narrow the run the same way the seed and verify plays do.
    pod_scope: >-
      {{ ((pods | default(pod_id) | default('') | string).split(',') | map('trim')
          | select('match', '^[0-9]+$') | map('int') | list)
         if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
         else [] }}
    in_scope: >-
      {{ ((crc_target_mode | default('shared_dc')) == 'member_server')
         and ((pod_scope | length) == 0 or (pod_num | int) in pod_scope) }}
  tasks:
    # USER_RIGHTS is a separate secedit area from the SECURITYPOLICY the M3-L2
    # seed writes and the student hardens, so the two do not overwrite each
    # other. Export first and re-apply the whole list: secedit /configure
    # replaces the members of a right rather than adding to them.
    - name: "Let domain accounts run scheduled tasks on {{ pod_name }}"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $sid = (New-Object System.Security.Principal.NTAccount(
          '{{ netbios }}\Domain Users')).Translate(
          [System.Security.Principal.SecurityIdentifier]).Value
        $export = Join-Path $env:TEMP 'crc-batch-logon-current.inf'
        Remove-Item -LiteralPath $export -Force -ErrorAction SilentlyContinue
        $null = secedit /export /areas USER_RIGHTS /cfg $export
        if ($LASTEXITCODE -ne 0) { throw "secedit /export exit $LASTEXITCODE" }
        $line = @(Get-Content -LiteralPath $export |
          Where-Object { $_ -match '^SeBatchLogonRight' })[0]
        $members = @()
        if ($line) {
          $members = @(($line -split '=', 2)[1] -split ',' |
            ForEach-Object { $_.Trim() } | Where-Object { $_ })
        }
        if ($members -contains "*$sid") {
          Remove-Item -LiteralPath $export -Force -ErrorAction SilentlyContinue
          'batch_logon_already_granted'
          return
        }
        $members += "*$sid"
        $inf = Join-Path $env:TEMP 'crc-batch-logon.inf'
        $body = "[Unicode]`r`nUnicode=yes`r`n[Version]`r`n" +
          "signature=`"`$CHICAGO`$`"`r`nRevision=1`r`n[Privilege Rights]`r`n" +
          "SeBatchLogonRight = " + [string]::Join(',', $members) + "`r`n"
        $utf16 = [System.Text.Encoding]::Unicode
        [System.IO.File]::WriteAllText($inf, $body, $utf16)
        $db = Join-Path $env:TEMP 'crc-batch-logon.sdb'
        Remove-Item -LiteralPath $db -Force -ErrorAction SilentlyContinue
        $log = Join-Path $env:TEMP 'crc-batch-logon.log'
        $null = secedit /configure /db $db /cfg $inf `
          /areas USER_RIGHTS /log $log
        if ($LASTEXITCODE -ne 0) {
          throw "secedit /configure exit $LASTEXITCODE - see $log"
        }
        Remove-Item -LiteralPath $export, $inf, $db -Force `
          -ErrorAction SilentlyContinue
        'batch_logon_granted'
      register: batch_logon
      changed_when: >-
        'batch_logon_granted' in (batch_logon.stdout | default(''))
      when: in_scope | bool

    - name: "Seed the weak M3-L2 local account policy on {{ pod_name }}"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $inf = Join-Path $env:TEMP 'crc-ia-m3l2-seed.inf'
        @'
        [Unicode]
        Unicode=yes
        [Version]
        signature="$CHICAGO$"
        Revision=1
        [System Access]
        MinimumPasswordLength = 6
        PasswordComplexity = 0
        PasswordHistorySize = 0
        MaximumPasswordAge = 90
        MinimumPasswordAge = 0
        LockoutBadCount = 0
        '@ | Set-Content -LiteralPath $inf -Encoding Unicode
        $db = Join-Path $env:TEMP 'crc-ia-m3l2-seed.sdb'
        Remove-Item -LiteralPath $db -Force -ErrorAction SilentlyContinue
        $null = secedit /configure /db $db /cfg $inf /areas SECURITYPOLICY /quiet
        if ($LASTEXITCODE -ne 0) { throw "secedit exit $LASTEXITCODE" }
        Remove-Item -LiteralPath $inf, $db -Force -ErrorAction SilentlyContinue
        'seeded_weak_local_policy'
      changed_when: true
      when: in_scope | bool

    # schtasks.exe rather than a module, because only ansible.windows is
    # available in the execution environment and it stores a task credential
    # the same way the DC seed does.
    - name: "Remove the M2-L1 scheduled task on {{ pod_name }}"
      ansible.windows.win_shell: |
        Unregister-ScheduledTask -TaskName '{{ task_name }}' -Confirm:$false -ErrorAction SilentlyContinue
        'removed'
      changed_when: true
      when: in_scope | bool

    - name: "Seed the M2-L1 scheduled task as a human account on {{ pod_name }}"
      ansible.windows.win_shell: >
        schtasks.exe /Create /TN "{{ task_name }}" /SC DAILY /ST 02:00
        /TR "powershell.exe -ExecutionPolicy Bypass -Command Write-Output 'Backup started'"
        /RU "{{ netbios }}\{{ prefix }}-s.jenkins" /RP "{{ seed_user_password }}"
        /RL HIGHEST /F
      no_log: true
      register: task_seed
      changed_when: true
      failed_when: false
      when:
        - in_scope | bool
        - seed_mode == 'seed'

    # no_log hides the whole result, including why it failed, so report the
    # part of it that cannot contain the seed credential.
    - name: "Fail with the schtasks error for {{ pod_name }}"
      ansible.builtin.fail:
        msg: >-
          seeding '{{ task_name }}' failed (rc={{ task_seed.rc | default('?') }}):
          {{ (task_seed.stdout | default('') ~ ' ' ~ task_seed.stderr | default('')) | trim }}
      when:
        - in_scope | bool
        - seed_mode == 'seed'
        - (task_seed.rc | default(0)) != 0

    # A reset that left the snapshot behind would keep crediting M2-L1 and
    # M3-L2 from the previous cohort until the next evidence pull.
    - name: "Drop the collected host state on {{ pod_name }}"
      ansible.windows.win_file:
        path: "{{ pod_evidence_root | default('C:\\CyberLab') }}\\{{ pod_name }}\\HostState"
        state: absent
      when:
        - in_scope | bool
        - seed_mode == 'reset'

    - name: Report the seeded session host state
      ansible.builtin.debug:
        msg: >-
          {{ pod_name }} {{ seed_mode }}: local account policy weakened
          {{ "and '" ~ task_name ~ "' running as " ~ prefix ~ "-s.jenkins"
             if seed_mode == 'seed' else "and the M2-L1 task removed" }}
      when: in_scope | bool
