---
# Ensures every student can RDP into the shared DC and administer only their own pod.
# Safe to re-run: the script only reports and fixes what is missing.
- name: "Lab Access: ensure student RDP + per-pod delegation on the shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_count: "{{ pod_count | default(20) }}"
  tasks:
    - name: Copy ensure-student-access.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/student_access/files/ensure-student-access.ps1"
        dest: C:\Windows\Temp\ensure-student-access.ps1

    - name: Ensure student access
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\ensure-student-access.ps1
        -PodCount {{ pod_count }}
      register: access_result

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ access_result.stdout_lines | default([]) }}"
