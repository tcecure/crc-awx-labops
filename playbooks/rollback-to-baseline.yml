---
# Reset all lab families back to clean baseline on the shared DCs.
# In the 2-DC shared model (acs-p01.local), there are no per-pod VMs.
# All 20 pods share dc01/dc02 with OU-based isolation.
#
# This playbook runs the AD-level reset for each lab family, removing
# all lab-created artifacts (users, group changes, OU moves, evidence
# folders) while preserving the baseline OU structure.
#
# For a full DC VM snapshot rollback (e.g., between course cohorts),
# use Proxmox directly to rollback the dc01/dc02 VM snapshots.
#
# Requirements:
#   - Inventory: CRC-LabPods (must contain 'crc_shared_dcs' group)
#   - Credential: CRC WinRM Verifier (Administrator on DCs)
- name: "Reset Labs: Roll Back to Clean Baseline (AD-Level)"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: "{{ range(1, (pod_count | default(20) | int) + 1) | list }}"
  tasks:
    - name: Copy reset-ac-labs.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_ac_dc/files/reset-ac-labs.ps1"
        dest: C:\Windows\Temp\reset-ac-labs.ps1

    - name: "Reset AC labs for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-ac-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show reset results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Baseline reset complete for {{ pod_list | length }} pods on
          {{ inventory_hostname }}. All AC lab artifacts removed.
          Ready to re-seed for the next lab family.
