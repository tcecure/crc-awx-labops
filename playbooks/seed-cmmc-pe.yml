---
- name: "Seed Labs: CMMC Level 1 Physical Protection (PE) - Shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: >-
      {{ ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
         if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
         else (range(1, (pod_count | default(20) | int) + 1) | list) }}
  tasks:
    - name: Copy PE seed script
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_pe_dc/files/apply-pe-lab.ps1"
        dest: C:\Windows\Temp\apply-pe-lab.ps1

    - name: Deploy PE templates
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../templates/pe/"
        dest: C:\CyberLab\_Templates\PE\

    - name: "Seed PE family for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\apply-pe-lab.ps1
        -PodId {{ item }} -TemplatesPath "C:\CyberLab\_Templates\PE"
        -ForceReseed {{ '1' if (force_reseed | default(false) | bool) else '0' }}
      loop: "{{ pod_list }}"
      register: seed_results

    - name: Show PE seed results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ seed_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Write PE seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: |
        $directory = "C:\CyberLab\Pod{{ '%02d' | format(item) }}\.families"
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        Set-Content -Path (Join-Path $directory 'PE.seeded') -Value (Get-Date -Format o)
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"
