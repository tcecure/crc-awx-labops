---
# Runs on the shared DCs by default; set crc_target_mode=member_server to
# run on each pod session host instead (crc_pod_servers).
- name: "Reset Labs: CMMC Level 1 Physical Protection (PE)"
  hosts: >-
    {{ 'crc_pod_servers'
       if (crc_target_mode | default('shared_dc')) == 'member_server'
       else 'crc_shared_dcs[0]' }}
  gather_facts: false
  vars:
    pod_list: >-
      {{ [pod_id | int]
         if (crc_target_mode | default('shared_dc')) == 'member_server'
         else (
              ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
              if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
              else (range(1, (pod_count | default(20) | int) + 1) | list)
         ) }}
  tasks:
    - name: Copy PE reset script
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_pe_dc/files/reset-pe-labs.ps1"
        dest: C:\Windows\Temp\reset-pe-labs.ps1

    - name: "Reset PE family for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-pe-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show PE reset results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"
