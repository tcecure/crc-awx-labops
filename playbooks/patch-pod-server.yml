---
# Brings a pod member server up to date before a cohort uses it: security
# patches, current Defender signatures, and a licensing check.
#
# The image these servers are cloned from was built from the Server 2022
# evaluation ISO in September 2025, so a freshly powered-on clone is both months
# behind on patches and out of evaluation grace ("Notification mode"). Notified
# evaluation servers nag and eventually shut themselves down mid-lab, so the
# state is checked explicitly and the evaluation is re-armed when it has run out
# and a re-arm is still available.
#
# Re-arming is the documented Microsoft mechanism (slmgr /rearm), not an
# activation bypass. A production cohort still needs real Datacenter keys: this
# play reports the licensing state so that decision is visible rather than
# discovered by a student.
#
#   Job template: Patch Pod Member Server
#   Limit:        pod03-srv     (run in small batches; each server reboots)
- name: "Pod servers: patch, refresh Defender and check licensing"
  hosts: crc_pod_servers
  gather_facts: false
  serial: 3
  vars:
    pod_server_rearm_expired_eval: true
  tasks:
    - name: Read the licensing state
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Continue'
        $lic = Get-CimInstance SoftwareLicensingProduct -Filter `
          "PartialProductKey IS NOT NULL AND ApplicationID='55c92734-d682-4d71-983e-d6ec3f16059f'" |
          Select-Object -First 1
        "name={0}" -f $lic.Name
        # 1 = licensed, 5 = notification (grace expired), 0 = unlicensed.
        "status={0}" -f $lic.LicenseStatus
        "grace_minutes={0}" -f $lic.GracePeriodRemaining
        "rearms_left={0}" -f (Get-CimInstance SoftwareLicensingService).RemainingWindowsReArmCount
      register: license_before
      changed_when: false

    - name: Re-arm the evaluation when its grace has run out
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        & cscript.exe //nologo C:\Windows\System32\slmgr.vbs /rearm | Out-String
      register: rearm
      when:
        - pod_server_rearm_expired_eval | bool
        - "'status=5' in license_before.stdout or 'status=0' in license_before.stdout"
        - "'rearms_left=0' not in license_before.stdout"
      changed_when: true

    - name: Update the Defender signatures
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Continue'
        Update-MpSignature -ErrorAction SilentlyContinue
        $d = Get-MpComputerStatus
        "signature_age_days={0}" -f $d.AntivirusSignatureAge
        "realtime={0}" -f $d.RealTimeProtectionEnabled
      register: defender
      changed_when: false

    - name: Install the security and critical updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
        reboot: true
        reboot_timeout: 2400
      register: updates

    - name: Re-read the licensing state after the re-arm and reboot
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Continue'
        (& cscript.exe //nologo C:\Windows\System32\slmgr.vbs /xpr | Out-String).Trim()
        "rearms_left={0}" -f (Get-CimInstance SoftwareLicensingService).RemainingWindowsReArmCount
        "last_patch={0}" -f ((Get-HotFix | Sort-Object InstalledOn -Descending |
          Select-Object -First 1).InstalledOn.ToString('yyyy-MM-dd'))
      register: license_after
      changed_when: false

    - name: Report what the server ended up with
      ansible.builtin.debug:
        msg: >-
          {{ license_before.stdout_lines + defender.stdout_lines
             + ['installed=' ~ (updates.installed_update_count | default(0))
                ~ ' failed=' ~ (updates.failed_update_count | default(0))
                ~ ' reboot_required=' ~ (updates.reboot_required | default(false))]
             + license_after.stdout_lines }}
