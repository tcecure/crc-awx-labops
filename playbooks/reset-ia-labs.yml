---
# AC and IA are the only families that read Active Directory, so their
# checks stay on the domain controller even after students move to their
# own member servers. Student evidence travels instead, through the drop share
# on the DC: the session hosts copy it with playbooks/sync-pod-evidence.yml as
# their own computer account, and this playbook moves it between the drop
# folder and the graded pod folder locally on the DC. Set
# crc_target_mode=member_server to enable it.
# Shared DC mode: reset all IA lab artifacts for all pods
# Removes IA-created users, scheduled tasks, and evidence files.
# After running this, pods are ready to be re-seeded.
- name: "Reset Labs: Remove IA Lab Artifacts (Shared DC)"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: "{{ range(1, (pod_count | default(20) | int) + 1) | list }}"
  tasks:
    - name: Copy reset-ia-labs.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_ia_dc/files/reset-ia-labs.ps1"
        dest: C:\Windows\Temp\reset-ia-labs.ps1

    - name: "Reset IA labs for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-ia-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show reset results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Clear IA seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_file:
        path: "C:\\CyberLab\\Pod{{ '%02d' | format(item) }}\\.families\\IA.seeded"
        state: absent
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"

    - name: Export the pod folder to the drop share for the session hosts
      ansible.builtin.include_tasks: tasks/sync-drop-local.yml
      vars:
        drop_direction: export

    # Host state describes the session host, so a reset that left it behind
    # would keep crediting M2-L1 and M3-L2 from the previous cohort.
    - name: "Drop the collected host state for Pod{{ '%02d' | format(item.1) }}"
      ansible.windows.win_file:
        path: "C:\\CyberLab\\{{ item.0 }}Pod{{ '%02d' | format(item.1) }}\\HostState"
        state: absent
      loop: "{{ ['', '_drop\\'] | product(pod_list) | list }}"
      loop_control:
        label: "{{ item.0 }}Pod{{ '%02d' | format(item.1) }}"
      when: (crc_target_mode | default('shared_dc')) == 'member_server'

# The M2-L1 task and the M3-L2 local policy live on the student's own server,
# so resetting them there is what makes the next cohort start from the seeded
# state instead of inheriting the previous student's work.
- name: "Reset Labs: IA state on the pod session hosts"
  hosts: crc_pod_servers
  gather_facts: false
  vars:
    pod_num: "{{ inventory_hostname | regex_replace('^[Pp][Oo][Dd]0*([0-9]+)-[Ss][Rr][Vv]$', '\\1') }}"
    pod_name: "Pod{{ '%02d' | format(pod_num | int) }}"
    task_name: "{{ pod_name }} ACS Nightly Backup"
    evidence_root: "{{ pod_evidence_root | default('C:\\CyberLab') }}"
    pod_scope: >-
      {{ ((pods | default(pod_id) | default('') | string).split(',') | map('trim')
          | select('match', '^[0-9]+$') | map('int') | list)
         if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
         else [] }}
    in_scope: >-
      {{ ((crc_target_mode | default('shared_dc')) == 'member_server')
         and ((pod_scope | length) == 0 or (pod_num | int) in pod_scope) }}
  tasks:
    - name: "Remove the M2-L1 scheduled task on {{ pod_name }}"
      ansible.windows.win_shell: |
        Unregister-ScheduledTask -TaskName '{{ task_name }}' -Confirm:$false -ErrorAction SilentlyContinue
        'removed'
      changed_when: true
      when: in_scope | bool

    - name: "Restore the seeded weak local account policy on {{ pod_name }}"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $inf = Join-Path $env:TEMP 'crc-ia-m3l2-reset.inf'
        @'
        [Unicode]
        Unicode=yes
        [Version]
        signature="$CHICAGO$"
        Revision=1
        [System Access]
        MinimumPasswordLength = 6
        PasswordComplexity = 0
        PasswordHistorySize = 0
        MaximumPasswordAge = 90
        MinimumPasswordAge = 0
        LockoutBadCount = 0
        '@ | Set-Content -LiteralPath $inf -Encoding Unicode
        $db = Join-Path $env:TEMP 'crc-ia-m3l2-reset.sdb'
        Remove-Item -LiteralPath $db -Force -ErrorAction SilentlyContinue
        $null = secedit /configure /db $db /cfg $inf /areas SECURITYPOLICY /quiet
        if ($LASTEXITCODE -ne 0) { throw "secedit exit $LASTEXITCODE" }
        Remove-Item -LiteralPath $inf, $db -Force -ErrorAction SilentlyContinue
        'reset_weak_local_policy'
      changed_when: true
      when: in_scope | bool

    - name: "Drop the local host state snapshot on {{ pod_name }}"
      ansible.windows.win_file:
        path: "{{ evidence_root }}\\{{ pod_name }}\\HostState"
        state: absent
      when: in_scope | bool

    - name: Report the reset session host state
      ansible.builtin.debug:
        msg: >-
          {{ pod_name }} reset: '{{ task_name }}' removed, local account policy
          back to the seeded weak values, host state cleared
      when: in_scope | bool
