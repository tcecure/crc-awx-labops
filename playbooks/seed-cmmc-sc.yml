---
# Runs on the shared DCs by default; set crc_target_mode=member_server to
# run on each pod session host instead (crc_pod_servers).
# seed-cmmc-sc.yml
# Seeds SC (System & Communications Protection) labs across all pods
# Targets: PodXX-GW (pfSense via SSH) + DC01 (WinRM)
#
# Target selection (backward compatible):
#   pods="7"       -> only Pod07
#   pods="7,9,12"  -> those pods
#   pod_id=7       -> only Pod07 (alias, used by the portal per-pod action)
#   (neither set)  -> all pods 1..pod_count  [original behavior]

- name: Seed SC Labs on PodXX-GW Gateways
  hosts: crc_pod_gateways
  gather_facts: false
  vars:
    sc_lab_id: "{{ lab_id | default('ALL') }}"
    # Gateways carry pod_id as a host var, so an empty survey answer for `pods`
    # must fall through to it instead of yielding an empty target list.
    pod_spec: "{{ (pods | default('') | string | trim) or (pod_id | default('') | string | trim) }}"
    pod_list: >-
      {{ [pod_id | int]
         if (crc_target_mode | default('shared_dc')) == 'member_server'
         else (
              (pod_spec.split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
              if (pod_spec | length) > 0
              else (range(1, (pod_count | default(20) | int) + 1) | list)
         ) }}
    my_pod: "{{ inventory_hostname | regex_replace('^pod0*([0-9]+)-gw$', '\\1') | int }}"
  tasks:
    - name: Seed SC gateway labs (only targeted pods)
      ansible.builtin.include_role:
        name: seed_sc_gw
      when: (my_pod | int) in (pod_list | map('int') | list)

- name: Seed SC Lab Artifacts on DC01
  hosts: >-
    {{ 'crc_pod_servers'
       if (crc_target_mode | default('shared_dc')) == 'member_server'
       else 'crc_shared_dcs[0]' }}
  gather_facts: false
  vars:
    sc_lab_id: "{{ lab_id | default('ALL') }}"
    pod_list: >-
      {{ [pod_id | int]
         if (crc_target_mode | default('shared_dc')) == 'member_server'
         else (
              ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
              if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
              else (range(1, (pod_count | default(20) | int) + 1) | list)
         ) }}
  tasks:
    - name: Seed SC artifacts for each pod
      ansible.builtin.include_role:
        name: seed_sc_dc
      vars:
        pod_id: "{{ item }}"
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"

    - name: "Write SC seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: |
        $d = "C:\CyberLab\Pod{{ '%02d' | format(item) }}\.families"
        New-Item -ItemType Directory -Force -Path $d | Out-Null
        Set-Content -Path (Join-Path $d 'SC.seeded') -Value (Get-Date -Format o)
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"
