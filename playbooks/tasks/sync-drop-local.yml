---
# DC-local half of the AC/IA evidence trip. The session hosts copy evidence
# into C:\CyberLab\_drop\PodXX as their own computer account
# (playbooks/sync-pod-evidence.yml); this moves it between the drop folder and
# the pod folder the AC/IA roles grade, on the DC, with the DC credential the
# calling playbook already holds.
#
#   drop_direction: import   drop -> C:\CyberLab\PodXX  (before verification)
#   drop_direction: export   C:\CyberLab\PodXX -> drop  (after seed or reset)
#
# A no-op outside member_server mode.
- name: "Move pod evidence on the domain controller: {{ drop_direction }}"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $pod = 'Pod{0:D2}' -f {{ item }}
    $lab = Join-Path 'C:\CyberLab' $pod
    $drop = Join-Path 'C:\CyberLab\_drop' $pod
    if ('{{ drop_direction }}' -eq 'import') { $src = $drop; $dst = $lab }
    else { $src = $lab; $dst = $drop }
    if (-not (Test-Path -LiteralPath $src)) { 'nothing_to_sync'; exit 0 }
    New-Item -ItemType Directory -Force -Path $dst | Out-Null
    $null = robocopy $src $dst /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
    if ($LASTEXITCODE -gt 7) { throw "robocopy exit $LASTEXITCODE" }
    '{0} {1}={2}' -f $pod, '{{ drop_direction }}', (Get-ChildItem -Recurse -File -LiteralPath $dst |
      Measure-Object).Count
  loop: "{{ pod_list }}"
  register: drop_sync
  changed_when: "'=' in drop_sync.stdout"
  when: (crc_target_mode | default('shared_dc')) == 'member_server'

- name: Show what the drop sync moved
  ansible.builtin.debug:
    msg: "{{ drop_sync.results | default([]) | map(attribute='stdout') | map('trim') | list }}"
  when: (crc_target_mode | default('shared_dc')) == 'member_server'
