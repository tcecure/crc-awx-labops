---
# Reset the staged CyDeploy Community Edition SC lab.
#
# Removes ONLY C:\CyberLab\PodNN\SC-Artifacts\CyDeploy and the
# .families\SC-CYDEPLOY.seeded marker. No gateway configuration is changed: the
# pod firewall rule set is owned by the existing SC reset playbook.
- name: "Reset Labs: CMMC SC CyDeploy Community Edition (staged) - Shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: >-
      {{ ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
         if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
         else (range(1, (pod_count | default(20) | int) + 1) | list) }}
  tasks:
    - name: Copy SC CyDeploy reset script
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../roles/seed_sc_cydeploy/files/reset-sc-cydeploy-labs.ps1"
        dest: C:\Windows\Temp\reset-sc-cydeploy-labs.ps1

    - name: "Reset SC CyDeploy lab for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-sc-cydeploy-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show SC CyDeploy reset results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"
