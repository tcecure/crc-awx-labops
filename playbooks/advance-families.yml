---
# Auto-advance lab families and issue completion certificates per pod.
#
# When a pod completes every lab in its current family, seed the NEXT family
# for that pod only. After all six families and 57 labs are complete, launch one
# idempotent final-certificate request if the student submitted a display name.
#
# Seed markers are read on the shared DC only, with the DC credential. In
# member-server mode the SI/MP/PE markers are written on the session hosts, and
# they reach the DC the same way student evidence does: the session hosts copy
# C:\CyberLab\PodXX into the drop share as their own computer account
# (playbooks/sync-pod-evidence.yml, template "Sync Pod Evidence (Session
# Host)"), so that has to run before this play. Reading the session hosts here
# instead would need their credential as well, and one job cannot hold two
# machine credentials.
#
# Requires (injected by an AWX "AWX API Token" custom credential):
#   AWX_HOST   e.g. http://192.168.1.103:30080
#   AWX_TOKEN  AWX OAuth2 token
# Optional extra vars:
#   crc_target_mode: shared_dc -> read pod state from the DC only (legacy)
#   advance_dry_run: "1"   -> compute + print decisions, do not launch seeds
#   advance_enabled: "0"      -> disable seed launching (report-only)
#   certificates_enabled: "1" -> enable certificate launching (default disabled)

- name: Collect family and certificate state from the shared DC
  hosts: crc_shared_dcs[0]
  gather_facts: false
  tasks:
    - name: Find seed markers, issued markers, and certificate profiles
      ansible.windows.win_find:
        paths: 'C:\CyberLab'
        recurse: true
        patterns:
          - '*.seeded'
          - '*.issued'
          - 'CertificateProfile.json'
      register: found_family_state

- name: Decide and launch per-pod family advancement
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    state_paths: >-
      {{ groups['crc_shared_dcs'][:1]
         | map('extract', hostvars, ['found_family_state', 'files'])
         | select('defined') | select('iterable')
         | flatten | map(attribute='path') | list }}
  tasks:
    - name: Save family state paths to the control node
      ansible.builtin.copy:
        content: "{{ state_paths | to_json }}"
        dest: /tmp/family_state_paths.json
        mode: "0600"

    - name: Run auto-advance
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/../scripts/advance_families.py"
      environment:
        CRC_TARGET_MODE: "{{ crc_target_mode | default('member_server') }}"
        CRC_HELD_BACK_PODS: "{{ crc_held_back_pods | default('') }}"
        ADVANCE_DRY_RUN: "{{ advance_dry_run | default('0') }}"
        ADVANCE_ENABLED: "{{ advance_enabled | default('1') }}"
        CERTIFICATES_ENABLED: "{{ certificates_enabled | default('0') }}"
        FAMILY_STATE_FILE: /tmp/family_state_paths.json
      register: advance_out
      changed_when: >-
        ('launched 0 seed job(s)' not in (advance_out.stdout | default('')))
        or ('launched 0 certificate job(s)'
            not in (advance_out.stdout | default('')))

    - name: Show auto-advance output
      ansible.builtin.debug:
        var: advance_out.stdout_lines
