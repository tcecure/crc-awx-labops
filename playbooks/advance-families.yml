---
# Auto-advance lab families per pod.
#
# When a pod completes every lab in its current family, seed the NEXT family
# for that pod only (per-pod) so students progress at their own pace without
# resetting completed work. Idempotent + guarded (see scripts/advance_families.py).
#
# Requires (injected by an AWX "AWX API Token" custom credential):
#   AWX_HOST   e.g. http://192.168.1.103:30080
#   AWX_TOKEN  AWX OAuth2 token
# Optional extra vars:
#   advance_dry_run: "1"   -> compute + print decisions, do not launch seeds
#   advance_enabled: "0"   -> disable launching (report-only)

- name: Collect per-family seed markers from DC01
  hosts: crc_shared_dcs[0]
  gather_facts: false
  tasks:
    - name: Find seed markers
      ansible.windows.win_find:
        paths: 'C:\CyberLab'
        recurse: true
        patterns: '*.seeded'
      register: found_markers

    - name: Save marker paths to the control node
      ansible.builtin.copy:
        content: "{{ found_markers.files | map(attribute='path') | list | to_json }}"
        dest: /tmp/seed_markers.json
      delegate_to: localhost

- name: Decide and launch per-pod family advancement
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    advance_dry_run: "{{ advance_dry_run | default('0') }}"
    advance_enabled: "{{ advance_enabled | default('1') }}"
  tasks:
    - name: Run auto-advance
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/../scripts/advance_families.py"
      environment:
        ADVANCE_DRY_RUN: "{{ advance_dry_run }}"
        ADVANCE_ENABLED: "{{ advance_enabled }}"
        SEED_MARKERS_FILE: /tmp/seed_markers.json
      register: advance_out
      changed_when: "'launched 0 seed job(s)' not in (advance_out.stdout | default(''))"

    - name: Show auto-advance output
      ansible.builtin.debug:
        var: advance_out.stdout_lines
