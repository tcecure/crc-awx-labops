---
# Shared DC mode: seed all pods on the shared DCs using OU-based isolation
- name: "Seed Labs: CMMC Level 1 Identification & Authentication (IA) - Shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    seed_user_password: "{{ seed_user_password | default(lookup('env', 'SEED_USER_PASSWORD')) }}"
    # Target selection (backward compatible):
    #   pods="7"       -> only Pod07
    #   pods="7,9,12"  -> those pods
    #   pod_id=7       -> only Pod07 (alias, used by the portal per-pod action)
    #   (neither set)  -> range(1, pod_count+1)  [original behavior]
    pod_list: >-
      {{ ((pods | default(pod_id) | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
         if (pods is defined or pod_id is defined)
         else (range(1, (pod_count | default(20) | int) + 1) | list) }}
  tasks:
    - name: Copy seed-ia-baseline.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_ia_dc/files/seed-ia-baseline.ps1"
        dest: C:\Windows\Temp\seed-ia-baseline.ps1

    - name: Copy apply-ia-lab.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_ia_dc/files/apply-ia-lab.ps1"
        dest: C:\Windows\Temp\apply-ia-lab.ps1

    - name: "Seed IA baseline for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\seed-ia-baseline.ps1
        -PodId {{ item }} -SeedPassword "{{ seed_user_password }}"
      loop: "{{ pod_list }}"
      register: baseline_results

    - name: Show baseline results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ baseline_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Apply all IA lab seeds for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\apply-ia-lab.ps1
        -LabId "ALL" -PodId {{ item }} -SeedPassword "{{ seed_user_password }}"
      loop: "{{ pod_list }}"
      register: seed_results

    - name: Show seed results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ seed_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"
