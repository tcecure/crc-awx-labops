---
# Reset the staged CyDeploy Community Edition SI labs.
#
# Removes ONLY C:\CyberLab\PodNN\SI-Artifacts\CyDeploy and the
# .families\SI-CYDEPLOY.seeded marker. The core SI labs, their artifacts and the
# SI.seeded marker are left untouched.
- name: "Reset Labs: CMMC SI CyDeploy Community Edition (staged) - Shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: >-
      {{ ((pods | default(pod_id) | default('') | string).split(',') | map('trim') | select('match', '^[0-9]+$') | map('int') | list)
         if ((pods | default('') | string | trim) != '' or (pod_id | default('') | string | trim) != '')
         else (range(1, (pod_count | default(20) | int) + 1) | list) }}
  tasks:
    - name: Copy SI CyDeploy reset script
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../roles/seed_si_cydeploy/files/reset-si-cydeploy-labs.ps1"
        dest: C:\Windows\Temp\reset-si-cydeploy-labs.ps1

    - name: "Reset SI CyDeploy labs for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-si-cydeploy-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show SI CyDeploy reset results
      ansible.builtin.debug:
        msg: "Pod{{ '%02d' | format(item.item) }}: {{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"
