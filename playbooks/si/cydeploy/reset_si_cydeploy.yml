---
# Reset the CyDeploy Community Edition SI labs on approved inactive pod servers.
#
# Removes only the CyDeploy artifacts for the selected lab (or the whole
# SI-Artifacts\CyDeploy tree and family marker when cydeploy_lab_id is ALL) and
# restores the SI-M5-L3 change target to its documented baseline. The core SI
# labs, their artifacts and the SI.seeded marker are left untouched.
#
# cydeploy_targets is mandatory: there is no all-pods default, so a forgotten
# variable fails the job instead of wiping every pod.
- name: "CYDEPLOY - Reset SI Labs"
  hosts: "{{ cydeploy_targets | mandatory }}"
  gather_facts: false
  serial: "{{ cydeploy_serial | default(2) }}"
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files:
    - ../../../vars/cydeploy-pods.yml
  tasks:
    - name: Run the CyDeploy preflight checks
      ansible.builtin.include_role:
        name: cydeploy_preflight

    - name: Copy SI CyDeploy reset script
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../roles/seed_si_cydeploy/files/reset-si-cydeploy-labs.ps1"
        dest: C:\Windows\Temp\reset-si-cydeploy-labs.ps1

    - name: "Reset SI CyDeploy labs for {{ cydeploy_pod_name }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-si-cydeploy-labs.ps1
        -PodId {{ cydeploy_pod_id }} -LabId {{ cydeploy_lab_id | default('ALL') }}
      register: cydeploy_si_reset

    - name: Report the SI CyDeploy reset outcome
      ansible.builtin.debug:
        msg:
          pod: "{{ cydeploy_pod_name }}"
          host: "{{ cydeploy_expected_hostname }}"
          action: "reset SI {{ cydeploy_lab_id | default('ALL') }}"
          result: "{{ 'reset to baseline' if cydeploy_si_reset.rc == 0 else 'failed' }}"
          output: "{{ cydeploy_si_reset.stdout_lines | default([]) }}"
          next: "CYDEPLOY - Seed SI {{ cydeploy_lab_id | default('ALL') }} to stage the lab again"
