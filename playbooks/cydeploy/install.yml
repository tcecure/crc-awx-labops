---
# Install and configure CyDeploy Community Edition on an approved inactive pod.
#
# Disabled until an administrator stages the approved installer on the control
# node; the checksum and the isolation finding are recorded in
# docs/cydeploy/CYDEPLOY-AGENT-FINDINGS.md.
# With cydeploy_install_enabled false this playbook still runs end to end and
# reports what it would do, which is how the rollout is rehearsed safely.
- name: "CYDEPLOY - Install and Configure"
  hosts: "{{ cydeploy_targets | mandatory }}"
  gather_facts: false
  serial: "{{ cydeploy_serial | default(1) }}"
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files:
    - ../../vars/cydeploy-pods.yml
  tasks:
    - name: Run the CyDeploy preflight checks
      ansible.builtin.include_role:
        name: cydeploy_preflight

    - name: Require the baseline snapshot before installing
      ansible.builtin.assert:
        that:
          - cydeploy_has_baseline_snapshot | bool
        fail_msg: >-
          {{ cydeploy_pod_name }} has no {{ cydeploy_snapshot_name }} snapshot.
          Run CYDEPLOY - Snapshot Inactive Pod first; installation must be
          reversible.
      when: cydeploy_require_snapshot | bool

    - name: Require a recorded isolation finding before installing
      ansible.builtin.assert:
        that:
          - cydeploy_isolation_verified | default(false) | bool
        fail_msg: >-
          Installation is enabled but cydeploy_isolation_verified is not set.
          CyDeploy must be shown to scan only this pod - no shared domain, no
          management network, no other pod - and that finding recorded in
          docs/cydeploy/CYDEPLOY-AGENT-FINDINGS.md before any pod is installed.
      when: cydeploy_install_enabled | bool

    - name: Install CyDeploy Community Edition
      ansible.builtin.include_role:
        name: cydeploy_community

    # CyDeploy stays on the pod for good, so the pod needs a restore point that
    # has it. Without this, the only snapshot to roll back to is the pre-install
    # one, and a routine between-cohort rollback would quietly uninstall the
    # agent.
    - name: Snapshot the pod with CyDeploy present
      when:
        - cydeploy_install_enabled | bool
        - cydeploy_post_install_snapshot | bool
        - not (cydeploy_has_installed_snapshot | bool)
      block:
        - name: "Snapshot {{ cydeploy_expected_hostname }} as {{ cydeploy_installed_snapshot_name }}"
          ansible.builtin.command:
            argv:
              - qm
              - snapshot
              - "{{ cydeploy_vmid }}"
              - "{{ cydeploy_installed_snapshot_name }}"
              - --description
              - "CyDeploy agent {{ cydeploy_version }} installed and configured by AWX; restore point that keeps the agent"
              - --vmstate
              - "0"
          delegate_to: "{{ cydeploy_proxmox_host }}"

        - name: Confirm the agent-present snapshot exists
          ansible.builtin.command:
            argv:
              - qm
              - listsnapshot
              - "{{ cydeploy_vmid }}"
          delegate_to: "{{ cydeploy_proxmox_host }}"
          changed_when: false
          register: cydeploy_installed_snapshot_check
          failed_when: cydeploy_installed_snapshot_name not in cydeploy_installed_snapshot_check.stdout

    - name: Report which restore points the pod now has
      ansible.builtin.debug:
        msg:
          pod: "{{ cydeploy_pod_name }}"
          keeps_cydeploy: "qm rollback {{ cydeploy_vmid }} {{ cydeploy_installed_snapshot_name }}"
          removes_cydeploy: "qm rollback {{ cydeploy_vmid }} {{ cydeploy_snapshot_name }}"
