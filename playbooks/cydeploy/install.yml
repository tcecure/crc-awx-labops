---
# Install and configure CyDeploy Community Edition on an approved inactive pod.
#
# Disabled until an administrator stages the approved installer on the control
# node; the checksum and the isolation finding are recorded in
# docs/cydeploy/CYDEPLOY-AGENT-FINDINGS.md.
# With cydeploy_install_enabled false this playbook still runs end to end and
# reports what it would do, which is how the rollout is rehearsed safely.
- name: "CYDEPLOY - Install and Configure"
  hosts: "{{ cydeploy_targets | mandatory }}"
  gather_facts: false
  serial: "{{ cydeploy_serial | default(1) }}"
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files:
    - ../../vars/cydeploy-pods.yml
  tasks:
    - name: Run the CyDeploy preflight checks
      ansible.builtin.include_role:
        name: cydeploy_preflight

    - name: Require the baseline snapshot before installing
      ansible.builtin.assert:
        that:
          - cydeploy_has_baseline_snapshot | bool
        fail_msg: >-
          {{ cydeploy_pod_name }} has no {{ cydeploy_snapshot_name }} snapshot.
          Run CYDEPLOY - Snapshot Inactive Pod first; installation must be
          reversible.
      when: cydeploy_require_snapshot | bool

    - name: Require a recorded isolation finding before installing
      ansible.builtin.assert:
        that:
          - cydeploy_isolation_verified | default(false) | bool
        fail_msg: >-
          Installation is enabled but cydeploy_isolation_verified is not set.
          CyDeploy must be shown to scan only this pod - no shared domain, no
          management network, no other pod - and that finding recorded in
          docs/cydeploy/CYDEPLOY-AGENT-FINDINGS.md before any pod is installed.
      when: cydeploy_install_enabled | bool

    - name: Install CyDeploy Community Edition
      ansible.builtin.include_role:
        name: cydeploy_community
