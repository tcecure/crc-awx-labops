---
# Runs on the shared DCs by default; set crc_target_mode=member_server to
# run on each pod session host instead (crc_pod_servers).
- name: "Verify Labs: CMMC Level 1 Media Protection (MP)"
  hosts: >-
    {{ 'crc_pod_servers'
       if (crc_target_mode | default('shared_dc')) == 'member_server'
       else 'crc_shared_dcs[0]' }}
  gather_facts: false
  vars:
    pod_list: >-
      {{ [pod_id | int]
         if (crc_target_mode | default('shared_dc')) == 'member_server'
         else (
         range(1, (pod_count | default(20) | int) + 1) | list
         ) }}
  tasks:
    - name: "Verify MP for Pod{{ '%02d' | format(item) }}"
      ansible.builtin.include_role:
        name: verify_mp_dc
      vars:
        pod_id: "{{ item }}"
      loop: "{{ pod_list }}"

- name: Consolidate MP results and produce report
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Build MP per-pod results
      ansible.builtin.set_fact:
        pod_results: >-
          {%- set pods = {} -%}
          {%- set dc_host = groups['crc_shared_dcs'][0] -%}
          {%- set member = (crc_target_mode | default('shared_dc')) == 'member_server' -%}
          {%- for i in range(1, (pod_count | default(20) | int) + 1) -%}
            {%- set pad = '%02d' | format(i) -%}
            {%- set key = 'pod' ~ pad ~ '_mp_results' -%}
            {%- set _ = pods.update({'pod' ~ pad: hostvars[(('pod' ~ pad ~ '-srv') if member else dc_host)][key] | default({})}) -%}
          {%- endfor -%}
          {{ pods }}

    - name: Build MP tracker artifacts
      ansible.builtin.set_fact:
        pod_results_pub: >-
          {%- set pods = {} -%}
          {%- for pod_key, pod_val in pod_results.items() -%}
            {%- set labs = {} -%}
            {%- for lab_key, lab_val in pod_val.items() -%}
              {%- set _ = labs.update({'MP-' ~ lab_key: lab_val}) -%}
            {%- endfor -%}
            {%- set _ = pods.update({pod_key: labs}) -%}
          {%- endfor -%}
          {{ pods }}

    - name: Compute MP totals
      ansible.builtin.set_fact:
        total_completed: >-
          {%- set count = [0] -%}
          {%- for pod_val in pod_results.values() -%}
            {%- for lab_val in pod_val.values() -%}
              {%- if lab_val.completed | default(false) -%}{%- set _ = count.append(count.pop() + 1) -%}{%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ count[0] }}
        total_incomplete: >-
          {%- set count = [0] -%}
          {%- for pod_val in pod_results.values() -%}
            {%- for lab_val in pod_val.values() -%}
              {%- if not (lab_val.completed | default(false)) -%}{%- set _ = count.append(count.pop() + 1) -%}{%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ count[0] }}

    - name: Publish MP results as AWX job artifacts
      ansible.builtin.set_stats:
        data: "{{ pod_results_pub }}"
        aggregate: false
        per_host: false

    - name: Synchronize MP results with the DRCC portal
      ansible.builtin.include_tasks: tasks/publish-progress.yml
      vars:
        progress_family: MP
        progress_pods: "{{ pod_results_pub }}"

    - name: Write MP verification report
      ansible.builtin.copy:
        content: "{{ {'course': 'CMMC Level 1 Media Protection (MP)', 'pods': pod_results_pub, 'totals': {'completed': total_completed | int, 'incomplete': total_incomplete | int}} | to_nice_json }}"
        dest: /runner/artifacts/MP_Verification_Report.json

    - name: Print MP completion matrix
      ansible.builtin.debug:
        msg: |
          === CMMC Level 1 Media Protection (MP) ===
          {% for i in range(1, (pod_count | default(20) | int) + 1) %}
          {%- set pad = '%02d' | format(i) -%}
          {%- set pod = pod_results['pod' ~ pad] -%}
          POD{{ pad }}: M1 [L1 {{ 'C' if pod['M1-L1'].completed | default(false) else 'I' }} | L2 {{ 'C' if pod['M1-L2'].completed | default(false) else 'I' }} | L3 {{ 'C' if pod['M1-L3'].completed | default(false) else 'I' }}]
          {% endfor %}
          TOTAL: completed={{ total_completed }} incomplete={{ total_incomplete }}
