---
- name: "Verify Labs: CMMC Level 1 Physical Protection (PE) - Shared DC"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: "{{ range(1, (pod_count | default(20) | int) + 1) | list }}"
  tasks:
    - name: "Verify PE for Pod{{ '%02d' | format(item) }}"
      ansible.builtin.include_role:
        name: verify_pe_dc
      vars:
        pod_id: "{{ item }}"
      loop: "{{ pod_list }}"

- name: Consolidate PE results and produce report
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Build PE per-pod results
      ansible.builtin.set_fact:
        pod_results: >-
          {%- set pods = {} -%}
          {%- set dc_host = groups['crc_shared_dcs'][0] -%}
          {%- for i in range(1, (pod_count | default(20) | int) + 1) -%}
            {%- set pad = '%02d' | format(i) -%}
            {%- set key = 'pod' ~ pad ~ '_pe_results' -%}
            {%- set _ = pods.update({'pod' ~ pad: hostvars[dc_host][key] | default({})}) -%}
          {%- endfor -%}
          {{ pods }}

    - name: Build PE tracker artifacts
      ansible.builtin.set_fact:
        pod_results_pub: >-
          {%- set pods = {} -%}
          {%- for pod_key, pod_val in pod_results.items() -%}
            {%- set labs = {} -%}
            {%- for lab_key, lab_val in pod_val.items() -%}
              {%- set _ = labs.update({'PE-' ~ lab_key: lab_val}) -%}
            {%- endfor -%}
            {%- set _ = pods.update({pod_key: labs}) -%}
          {%- endfor -%}
          {{ pods }}

    - name: Compute PE totals
      ansible.builtin.set_fact:
        total_completed: >-
          {%- set count = [0] -%}
          {%- for pod_val in pod_results.values() -%}
            {%- for lab_val in pod_val.values() -%}
              {%- if lab_val.completed | default(false) -%}{%- set _ = count.append(count.pop() + 1) -%}{%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ count[0] }}
        total_incomplete: >-
          {%- set count = [0] -%}
          {%- for pod_val in pod_results.values() -%}
            {%- for lab_val in pod_val.values() -%}
              {%- if not (lab_val.completed | default(false)) -%}{%- set _ = count.append(count.pop() + 1) -%}{%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ count[0] }}

    - name: Publish PE results as AWX job artifacts
      ansible.builtin.set_stats:
        data: "{{ pod_results_pub }}"
        aggregate: false
        per_host: false

    - name: Write PE verification report
      ansible.builtin.copy:
        content: "{{ {'course': 'CMMC Level 1 Physical Protection (PE)', 'pods': pod_results_pub, 'totals': {'completed': total_completed | int, 'incomplete': total_incomplete | int}} | to_nice_json }}"
        dest: /runner/artifacts/PE_Verification_Report.json

    - name: Print PE completion matrix
      ansible.builtin.debug:
        msg: |
          === CMMC Level 1 Physical Protection (PE) ===
          {% for i in range(1, (pod_count | default(20) | int) + 1) %}
          {%- set pad = '%02d' | format(i) -%}
          {%- set pod = pod_results['pod' ~ pad] -%}
          POD{{ pad }}: M1 [L1 {{ 'C' if pod['M1-L1'].completed | default(false) else 'I' }} | L2 {{ 'C' if pod['M1-L2'].completed | default(false) else 'I' }}] M2 [L1 {{ 'C' if pod['M2-L1'].completed | default(false) else 'I' }} | L2 {{ 'C' if pod['M2-L2'].completed | default(false) else 'I' }}] M3 [L1 {{ 'C' if pod['M3-L1'].completed | default(false) else 'I' }} | L2 {{ 'C' if pod['M3-L2'].completed | default(false) else 'I' }}]
          {% endfor %}
          TOTAL: completed={{ total_completed }} incomplete={{ total_incomplete }}
