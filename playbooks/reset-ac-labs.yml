---
# AC and IA are the only families that read Active Directory, so their
# checks stay on the domain controller even after students move to their
# own member servers. Student evidence travels instead: see
# sync-pod-evidence.yml. Set crc_target_mode=member_server to enable it.
# Shared DC mode: reset all AC lab artifacts for all pods
# This is the "surgical" reset — removes lab-created users, undoes group
# membership changes, restores OU placement, and cleans evidence folders.
# After running this, pods are ready to be re-seeded for the next lab family.
# For a full VM-level reset, use rollback-to-baseline.yml instead.
- name: "Reset Labs: Remove AC Lab Artifacts (Shared DC)"
  hosts: crc_shared_dcs[0]
  gather_facts: false
  vars:
    pod_list: "{{ range(1, (pod_count | default(20) | int) + 1) | list }}"
  tasks:
    - name: Copy reset-ac-labs.ps1
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../roles/seed_ac_dc/files/reset-ac-labs.ps1"
        dest: C:\Windows\Temp\reset-ac-labs.ps1

    - name: "Reset AC labs for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_shell: >
        powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\reset-ac-labs.ps1
        -PodId {{ item }}
      loop: "{{ pod_list }}"
      register: reset_results

    - name: Show reset results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default([]) }}"
      loop: "{{ reset_results.results }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item.item) }}"

    - name: "Clear AC seed marker for Pod{{ '%02d' | format(item) }}"
      ansible.windows.win_file:
        path: "C:\\CyberLab\\Pod{{ '%02d' | format(item) }}\\.families\\AC.seeded"
        state: absent
      loop: "{{ pod_list }}"
      loop_control:
        label: "Pod{{ '%02d' | format(item) }}"

- name: Push the pod folder back to the session hosts
  ansible.builtin.import_playbook: sync-pod-evidence.yml
  vars:
    sync_direction: push
